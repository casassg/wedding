- id: utila
  title: "Utila"
  description: "La més petita de les illes de la Badia, amb un ambient relaxat i bohemi. Ofereix busseig de primera a l'[Escull Mesoamericà](https://ca.wikipedia.org/wiki/Barrera_de_corall_mesoamericana) i és un dels millors llocs del món per veure taurons balena (el desembre és temporada alta!). És l'hàbitat de la iguana Swamper, una espècie endèmica que no es troba enlloc més del planeta."
  icon: "fa-solid fa-fish"
  long_description: |
    Paradís de motxillers i bussejadors, Utila ofereix algunes de les certificacions [PADI](https://www.padi.com/) més econòmiques del Carib. No hi circulen cotxes: mou-te en tuk-tuk, quad o carret de golf.

    Destaquen: [Airport Caves](https://www.google.com/maps/place/Airport+Caves/@16.1048,-86.9268,17z/) per fer snorkel increïble des de la vora amb coves i esquerdes (nivell mitjà); Neptune's a [Coral Beach Village](https://www.coralbeachutila.com/) (accés en vaixell) per passar el dia a la platja i fer snorkel; [Water Caye](https://www.google.com/maps/place/Water+Cay/@16.1294,-86.8794,15z/) per una excursió a una illa deshabitada verge; [Pumpkin Hill](https://www.google.com/maps/place/Pumpkin+Hill/@16.1165,-86.9488,16z/) per una caminada curta al punt més alt de l'illa; i [Utila Chocolate Company](https://www.instagram.com/utilachocolate/) per tastar xocolata artesanal.
  tips:
    - "🦈 El desembre és temporada alta de taurons balena: ideal per al viatge!"
    - "💰 Un dels llocs més econòmics del món per treure's el títol PADI."
    - "⛴️ Ferri des de Roatán (1 h) o La Ceiba. Pots reservar a [utilaferry.com](https://utilaferry.com/)."
    - "🤿 Airport Caves té un snorkel brutal des de la riba, però cal un nivell mitjà."
    - "💵 Porteu efectiu (lempires o dòlars americans)."
  links:
    - label: "Viquipèdia"
      url: "https://en.wikipedia.org/wiki/Utila"
    - label: "Utila Guide"
      url: "https://www.utilaguide.com/"
      icon: "fa-solid fa-globe"
    - label: "Guia de Viatge"
      url: "https://madisonsfootsteps.com/trip-itinerary-utila-honduras/"
      icon: "fa-solid fa-book"

- id: ceiba
  title: "La Ceiba"
  description: "La capital de l'oci d'Hondures i porta d'entrada a les illes de la Badia, situada al peu de l'imponent [Pico Bonito](https://en.wikipedia.org/wiki/Pico_Bonito_National_Park) (2.435 m). Seu del festival més gran del país (el [Gran Carnaval Internacional](https://en.wikipedia.org/wiki/La_Ceiba_Carnival), al maig), també ofereix ràfting de primer nivell, una comunitat [garífuna](https://ca.wikipedia.org/wiki/Gar%C3%ADfunes) vibrant i una vida nocturna llegendària."
  icon: "fa-solid fa-masks-theater"
  long_description: |
    Batejada per una ceiba gegant que creixia prop dels vells molls, La Ceiba es va desenvolupar com a port bananer a finals del s. XIX amb els germans Vaccaro (ara Dole). Avui és el centre de l'ecoturisme a Hondures.

    Atraccions principals: el [Parc Nacional Pico Bonito](https://en.wikipedia.org/wiki/Pico_Bonito_National_Park), amb senders per la selva, cascades i gran biodiversitat; el [riu Cangrejal](https://en.wikipedia.org/wiki/Cangrejal_River) per fer ràfting de classe III-IV just a l'est de la ciutat; i el [Refugi de Vida Silvestre Cuero y Salado](https://en.wikipedia.org/wiki/Cuero_y_Salado_Wildlife_Refuge) a l'oest, on es poden veure manatís salvatges.

    Hi ha ferris diaris a Roatán i Utila. La Zona Viva és el districte d'oci nocturn. Al Barrio La Isla, a l'altra banda de l'estuari, hi viu una pròspera comunitat garífuna.
  tips:
    - "⛴️ Porta d'entrada a les illes de la Badia: ferris dos cops al dia cap a Roatán i Utila."
    - "🎭 El Carnaval (3r dissabte de maig) atrau més de 500.000 persones. No coincideix amb el viatge, però és la festa més grossa del país!"
    - "🌊 Ràfting de classe mundial (nivell III-IV) al riu Cangrejal."
    - "🦭 Al Refugi Cuero y Salado hi ha manatís salvatges; s'hi fan tours en llanxa."
    - "🦋 El Museu de Papallones i Insectes té més de 12.000 espècimens de 68 països."
    - "🌿 El Parc Nacional Pico Bonito té rutes excel·lents per la selva i cascades."
  links:
    - label: "Viquipèdia"
      url: "https://en.wikipedia.org/wiki/La_Ceiba"

- id: yojoa
  title: "Llac de Yojoa"
  description: "El llac més gran d'Hondures, envoltat de bosc ennuvolat i llar de més de 400 espècies d'aus. Tours de xocolata artesanal, parcs ecològics i observació d'aus, a més de les Coves de Taulabé i les Cascades de Pulhapanzak."
  icon: "fa-solid fa-dove"
  long_description: |
    Situat a 80 km de San Pedro Sula, aquest llac impressionant ofereix moltes activitats: xocolata artesanal a [Yojoa Chocolate](https://yojoachocolate.com/) i [Luna del Puente](https://www.instagram.com/lunadelpuente/) (tours del gra a la rajola); [Bioparque Paradise](https://www.hondurastips.hn/2013/07/29/bioparque-paradise-los-naranajos/) (parc ecològic de 78 hectàrees amb senders, cascades i ruïnes lenca); [PANACAM Lodge](https://www.panacamlodge.com/) al [Parc Nacional Cerro Azul Meámbar](https://en.wikipedia.org/wiki/Cerro_Azul_Me%C3%A1mbar_National_Park) (lodge de muntanya amb rutes, torres de guaita i vistes panoràmiques); [D&D Brewery](https://ddbrewery.com/) (la primera cerveseria artesanal d'Hondures, amb tours d'ocells); senders del Parc Los Naranjos; Hotel Finca Las Glorias per menjar local; passejos en barca a Honduyate; parc aquàtic [Lagolandia](https://www.instagram.com/lagolandiahn/); i Los Domos de Agualpa, amb vistes espectaculars al llac.

    La zona també ofereix dues parades naturals espectaculars a la carretera principal: les **Coves de Taulabé**, que s'estenen quilòmetres sota terra amb estalactites i estalagmites espectaculars visibles des de passarel·les il·luminades, un escapament perfecte de la calor; i **Pulhapanzak**, una de les cascades més boniques de Centreamèrica, amb 43 metres d'aigua caient en una piscina natural envoltada de bosc tropical, on pots fer ràpel darrere la cascada, nedar a les piscines naturals i explorar senders on es veuen guacamais.
  tips:
    - "🍺 Visita D&D Brewery, la primera cerveseria artesanal d'Hondures."
    - "🍫 Fes un tour de xocolata: aprèn el procés del gra a la rajola en finques de cacau locals."
    - "🐟 Tasta la tilàpia fregida 'estil llac de Yojoa' als restaurants de carretera."
    - "🐦 Més de 400 espècies d'aus: porta els prismàtics!"
    - "🌡️ Ambdues són perfectes per escapar de la calor: les coves es mantenen fresques, Pulhapanzak té bassa amb brisa."
    - "🧗 A Pulhapanzak pots fer ràpel darrere la cascada de 43 m (guiat, cost extra)."
    - "👟 Porta calçat còmode per a ambdues; les coves tenen passarel·les, la cascada té senders."
    - "📍 Ambdues són a la carretera principal: Taulabé ~1h de Copán, Pulhapanzak ~1.5h."
    - "🦜 Pulhapanzak és un bon lloc per veure guacamais."
