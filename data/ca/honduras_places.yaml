- id: roatan
  title: "Roatán"
  description: "La més gran de les illes de la Badia, amb busseig de classe mundial, platges caribenyes de somni i santuaris de vida salvatge. A només 40 minuts en llanxa, els Cayos Cochinos ofereixen esculls verges, boes rosades endèmiques i autèntics pobles pesquers garífunes."
  icon: "fa-solid fa-water"
  long_description: |
    West Bay Beach és considerada sovint una de les millors platges del Carib, amb sorra blanca i l'escull a poca distància nedant. West End és el centre turístic principal, amb centres de busseig, restaurants i vida nocturna. L'escull està protegit pel [Roatan Marine Park](https://www.roatanmarinepark.org/), una organització sense ànim de lucre amb programes de restauració de coral (pots visitar-ne el centre o fer un taller de pesca de peix lleó).

    No et perdis els santuaris d'animals: [Daniel Johnson's Monkey & Sloth Hangout](https://monkeyandslothhangout.com/) per veure'ls de prop, i [Gumbalimba Park](https://roatan.online/gumbalimba-park) per a tirolines i natura. La [Fàbrica de Xocolata de Roatán](https://roatan.online/roatan-chocolate-factory) ofereix tours gratuïts del procés del gra a la rajola. Si busques aventura, explora els túnels de manglars a l'extrem est, més tranquil, o relaxa't a les platges solitàries de Camp Bay.

    A tan sols 40 minuts en llanxa, els **Cayos Cochinos** són un santuari marí pristí gestionat per la [Fundación Cayos Cochinos](https://www.cayoscochinos.org/), que protegeix alguns dels esculls més intactes del Carib. Els visitants poden fer senderisme per avistar la boa rosada endèmica a Cayo Mayor, fer snorkel sobre esculls verges i conèixer la cultura garífuna autèntica al poble pesquer de Chachahuate. La Fundació porta programes actius de restauració de coral i conservació de tortugues marines, convertint-los en un dels destins ecoturístics més valuosos d'Hondures.
  tips:
    - "🏊 El millor snorkel és a la platja de West Bay: l'escull és a tocar de la sorra."
    - "🐠 Fes servir crema solar que no malmeti els esculls per protegir el coral."
    - "🛳️ Evita anar a comprar quan arriben creuers: els preus es dupliquen o tripliquen."
    - "🦟 Posa't repel·lent fort (tipus Relec) sovint: els mosquits de sorra piquen sense avisar."
    - "🛥️ Els Cayos Cochinos són a 40 min en llanxa des de Roatán: excursió ideal a esculls verges i boes rosades."
    - "🐍 Fes una caminada guiada a Cayo Mayor per avistar la boa rosada endèmica."
    - "🏘️ Visita l'illot Chachahuate per viure la cultura garífuna autèntica en una àrea marina protegida."
