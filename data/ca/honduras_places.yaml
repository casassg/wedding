- id: tela
  title: "Tela"
  description: "Ciutat de platja caribenya amb atraccions imperdibles: el [Parc Nacional Punta Sal](https://es.wikipedia.org/wiki/Parque_nacional_Jeannette_Kawas), amb platges verges; el [Jardí Botànic Lancetilla](https://en.wikipedia.org/wiki/Lancetilla_Botanical_Garden) (el més gran de Llatinoamèrica, a 5 min), i resorts i clubs de platja."
  icon: "fa-solid fa-umbrella-beach"
  long_description: |
    Tela ofereix platges caribenyes precioses i experiències diverses. Punta Sal ([Parc Nacional Jeannette Kawas](https://en.wikipedia.org/wiki/Jeannette_Kawas_National_Park)) té platges verges i fauna salvatge. [Playa Miami](https://www.google.com/maps/place/Playa+Miami/@15.7694,-87.4427,16z/) té aigües tranquil·les, ideals per a famílies.

    El [Jardí Botànic Lancetilla](https://en.wikipedia.org/wiki/Lancetilla_Botanical_Garden), fundat el 1926, abasta 1.600 hectàrees amb més de 1.500 espècies de plantes, a només 5 minuts del poble. [Indura Resort](https://www.induraresort.com/) ofereix luxe i golf, mentre que [La Ensenada Beach Club](https://www.google.com/maps/place/La+Ensenada+Beach+Resort/@15.7903,-87.4825,15z/) i l'[Hotel Telamar](https://www.google.com/maps/place/Villas+Telamar/@15.7756,-87.4593,16z/) brinden relaxació a primera línia de mar.
  tips:
    - "🏖️ Punta Sal té platges verges i fauna salvatge; reserva un tour en vaixell."
    - "🌿 El Jardí Botànic Lancetilla és el més gran de Llatinoamèrica (a només 5 min)."
    - "🥥 Tasta el coco fresc dels venedors de la platja i el pa de coco garífuna."
