- id: san_pedro
  title: "San Pedro Sula"
  description: "La capital industrial d'Hondures i porta d'entrada a excursions increïbles d'un dia. Explora el Parc Nacional El Cusuco, camina pels senders d'Angeli Gardens, compra al mercat artesanal Guamilito o visita els camps d'hortènsies d'El Merendón."
  icon: "fa-solid fa-city"
  long_description: |
    La segona ciutat més gran ofereix opcions excel·lents d'excursions a menys de 100 km. El [Parc Nacional El Cusuco](https://en.wikipedia.org/wiki/Cusuco_National_Park) és una reserva de bosc ennuvolat amb una gran biodiversitat.

    [Angeli Gardens](https://www.instagram.com/angeligardens/) ofereix senders i tirolines. El [mercat Guamilito](https://www.google.com/maps/place/Guamilito+Market/@15.5026,-88.0284,17z/) és el lloc ideal per comprar artesania hondurenya autèntica. El Merendón té uns camps d'hortènsies preciosos i la ruta de la Coca Cola. Si arribes tard o vols un vol d'hora l'endemà, l'Intercity i el Diana Princess són bones opcions per passar una nit prop de l'aeroport.
  tips:
    - "🌺 Visita els camps d'hortènsies d'El Merendón quan floreixen."
    - "🛍️ Mercat Guamilito per a artesania hondurenya autèntica."
    - "🌿 El Parc Nacional El Cusuco té bosc ennuvolat amb una biodiversitat increïble."
    - "☕ Cafeteries recomanades a San Pedro Sula: Welchez, Backup, Mezcal, TGP, Cafeteo. A Peña Blanca: Dorao."
