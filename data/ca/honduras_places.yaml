- id: puerto_cortes
  title: "Puerto Cortés i Omoa"
  description: "La principal ciutat portuària caribenya d'Hondures, amb un bonic centre històric, i el poble de platja d'Omoa amb la seva impressionant fortalesa del segle XVIII i marisc increïble — a només 20-40 minuts de l'aeroport."
  icon: "fa-solid fa-anchor"
  long_description: "Puerto Cortés és el principal port caribeny d'Hondures, amb una història profunda. Fundat al segle XVI, va ser un dels ports colonials més importants d'Espanya, exportant plata, anyil i altres béns a Europa. Avui, el [centre històric](https://www.youtube.com/watch?v=QBRrNOe4tVY) conserva cases de fusta colonials de colors i un passeig marítim animat. A només 20 minuts al sud hi ha **Omoa**, un poble de platja relaxat on l'atracció principal és la [Fortalesa de San Fernando de Omoa](https://es.wikipedia.org/wiki/Fortaleza_de_San_Fernando_de_Omoa) — una imponent fortalesa colonial espanyola del segle XVIII construïda per protegir la costa dels pirates, que ara alberga un petit museu. Les platges d'Omoa tenen aigües tranquil·les perfectes per nedar, i les *comidas típicas* (peix fregit, gambes, pa de coco) són de les millors d'Hondures. També és un important lloc de nidificació de tortugues marines, amb programes locals de conservació que protegeixen els nius a les platges d'Omoa. [Villas Amelia](https://www.instagram.com/villas.amelia/) és d'un amic nostre — perfecte per allotjar-s'hi o visitar-la."
  tips:
    - "🏰 No et perdis la Fortalesa de San Fernando a Omoa — un dels llocs colonials més importants d'Hondures."
    - "🐟 Prova el peix fregit i les gambes a la platja d'Omoa — dels millors mariscs del país."
    - "🏘️ Explora el centre històric de Puerto Cortés amb les seves cases de fusta colonials de colors."
    - "🐢 Novembre-desembre és temporada de nidificació de tortugues marines a les platges d'Omoa."
    - "📍 Puerto Cortés és a 20 min de l'aeroport SAP; Omoa a 40 min — parada perfecta de camí a Copán."
    - "🚢 Observa els vaixells de càrrega des del passeig de Puerto Cortés — un dels ports més actius de Centreamèrica."
