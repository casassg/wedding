- id: tegucigalpa
  title: "Tegucigalpa"
  description: "La capital d'Hondures en una vall muntanyosa a 1.000 m d'altitud, amb arquitectura colonial, mercats animats i boscos ennuvolats propers. A les portes de la ciutat: pobles colonials de muntanya, un mirador estil Crist Redemptor i bon menjar."
  icon: "fa-solid fa-city"
  long_description: |
    Fundada el 1578 als vessants del cerro El Picacho, Tegucigalpa és la capital política d'Hondures i una ciutat de contrastos. El centre històric alberga la [Catedral de San Miguel](https://en.wikipedia.org/wiki/Cathedral_of_Saint_Michael_the_Archangel,_Tegucigalpa) (s. XVIII), la Galeria Nacional d'Art a l'antic Paraninfo i l'animat Mercat San Isidro. La [Basílica de Suyapa](https://en.wikipedia.org/wiki/Basilica_of_Our_Lady_of_Suyapa), dedicada a la petita imatge patrona d'Hondures, rep pelegrins tot l'any, especialment el 3 de febrer.

    Tres poblets comparteixen la mateixa carretera a només 30 minuts de la ciutat. **[Valle de Ángeles](https://en.wikipedia.org/wiki/Valle_de_%C3%81ngeles)** és un preciós poble colonial de muntanya famós per la seva artesania, carrers empedrats i mercats de cap de setmana. **San Juancito** és un antic poble miner, i **Santa Lucía** ofereix les millors vistes de la vall.

    Més a prop de la ciutat, el **Crist del Picacho** és la versió més petita del Crist Redemptor de Rio: una estàtua al cim amb vistes panoràmiques, restaurants i llocs de vi, a uns 15 minuts del centre. A uns 40 minuts, **Finca La Catadora** és un peculiar vinyar de móres amb bon menjar i vistes. Per als amants de l'aire lliure, el **[Parc Nacional La Tigra](https://en.wikipedia.org/wiki/La_Tigra_National_Park)** és un bosc ennuvolat amb excel·lents senders, una de les àrees protegides més antigues del país.

    De tornada a la ciutat, **9 Patrias** ofereix un menú degustació de 7 plats nascut d'un programa universitari de gastronomia: ingredients locals inspirats en tribus antigues d'Hondures, com peix cuinat amb cacau, amb cada plat explicat, una experiència estil Michelin a un nivell més accessible. Per a la història, no us perdeu el [Museu per a la Identitat Nacional](https://share.google/adcS2XJ4qalKy4lGi).
  tips:
    - "🌿 El Parc Nacional La Tigra és a només 30 minuts del centre."
    - "☕ Cafeteries recomanades a la ciutat: Nativo, Cafetano, Plácido, La Montaña, Varietal, TGP, Crepería, Aroma."
    - "☕ Als pobles: Varietal a Valle de Ángeles; La Casa del Té i Tres Puntos a Santa Lucía."
    - "🌲 Els pobles de muntanya són més frescos que la ciutat; porta una jaqueta lleugera."
  links:
