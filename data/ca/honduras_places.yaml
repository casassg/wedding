- id: cayos
  title: "Cayos Cochinos"
  description: "Àrea marina protegida verge amb [dues illes petites i 13 illots de corall](https://en.wikipedia.org/wiki/Cayos_Cochinos). Llar de la boa rosada i de pobles pesquers garífunes. National Geographic l'anomena 'el somni d'un biòleg marí'."
  icon: "fa-solid fa-umbrella-beach"
  long_description: "Aquest santuari marí protegit forma part del Sistema d'Esculls Mesoamericà i ofereix busseig i snorkel en aigües cristal·lines. Gestionat per la [Fundación Cayos Cochinos](https://www.cayoscochinos.org/), les illes acullen programes crítics de restauració de corall i conservació de tortugues marines. Els visitants poden explorar les illes principals (Cayo Mayor i Menor), fer senderisme per veure la boa rosada endèmica i conèixer la cultura local al poble garífuna de Chachahuate. Tant si hi aneu d'excursió d'un dia com si us allotgeu en un ecoresort, l'experiència és inoblidable."
  tips:
    - "🛥️ Accessible en llanxa des de La Ceiba (1,5 h), Roatán (40 min) o Sambo Creek."
    - "🐍 Llar de la boa rosada endèmica; fes una caminada guiada a Cayo Mayor per veure-la."
    - "🤿 Àrea marina protegida amb esculls verges, perfecta per a snorkel i busseig."
    - "🏘️ Visita l'illot Chachahuate per menjar i viure la cultura garífuna autèntica."
