- id: roatan
  title: "Roatán"
  description: "La més gran de les illes de la Badia (~59 km de llarg), amb busseig de classe mundial a l'[Escull Mesoamericà](https://ca.wikipedia.org/wiki/Barrera_de_corall_mesoamericana), el segon sistema d'esculls més gran del món. És la llar de la [cultura garífuna](https://ca.wikipedia.org/wiki/Gar%C3%ADfunes) a Punta Gorda (fundada el 1797) i té platges impressionants i santuaris de vida salvatge increïbles."
  icon: "fa-solid fa-water"
  long_description: "West Bay Beach és considerada sovint una de les millors platges del Carib, amb sorra blanca i l'escull a poca distància nedant. West End és el centre turístic principal, amb centres de busseig, restaurants i vida nocturna. L'escull està protegit pel [Roatan Marine Park](https://www.roatanmarinepark.org/), una organització sense ànim de lucre amb programes de restauració de coral (pots visitar-ne el centre o fer un taller de pesca de peix lleó). No et perdis els santuaris d'animals: [Daniel Johnson's Monkey & Sloth Hangout](https://monkeyandslothhangout.com/) per veure'ls de prop, i [Gumbalimba Park](https://roatan.online/gumbalimba-park) per a tirolines i natura. La [Fàbrica de Xocolata de Roatán](https://roatan.online/roatan-chocolate-factory) ofereix tours gratuïts del procés del gra a la rajola. Si busques aventura, explora els túnels de manglars a l'extrem est, més tranquil, o relaxa't a les platges solitàries de Camp Bay."
  tips:
    - "🏊 El millor snorkel és a la platja de West Bay: l'escull és a tocar de la sorra."
    - "🐠 Fes servir crema solar que no malmeti els esculls per protegir el coral."
    - "🛳️ Evita anar a comprar quan arriben creuers: els preus es dupliquen o tripliquen."
    - "🦟 Posa't repel·lent fort (tipus Relec) sovint: els mosquits de sorra piquen sense avisar."
  links:
    - label: "Viquipèdia"
      url: "https://ca.wikipedia.org/wiki/Roat%C3%A1n"
      icon: "fa-solid fa-landmark"
