- id: san_pedro
  title: "San Pedro Sula"
  description: "La capital industrial d'Hondures i porta d'entrada a excursions increïbles d'un dia. Explora el Parc Nacional El Cusuco, camina pels senders d'Angeli Gardens, compra al mercat artesanal Guamilito o visita els camps d'hortènsies d'El Merendón."
  icon: "fa-solid fa-city"
  long_description: "La segona ciutat més gran ofereix opcions excel·lents d'excursions a menys de 100 km. El Parc Nacional El Cusuco és una reserva de bosc ennuvolat amb una gran biodiversitat. Angeli Gardens ofereix senders i tirolines. El mercat Guamilito és el lloc ideal per comprar artesania hondurenya autèntica. El Merendón té uns camps d'hortènsies preciosos i la ruta de la Coca Cola."
  tips:
