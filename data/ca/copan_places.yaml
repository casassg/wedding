- id: chocolate
  title: "Tea & Chocolate Place"
  description: "Museu interactiu del cacau dirigit per la família d'un arqueòleg. Aprèn les tradicions maies de la xocolata, tasta begudes autèntiques i gaudeix de la posta de sol des de la terrassa."
  icon: "fa-solid fa-mug-hot"
  long_description: |
    Dirigit per l'arqueòleg David Sedat i la seva filla Carolina, aquest espai únic és meitat museu, meitat experiència de degustació. Aprèn com els maies veneraven el cacau com a 'aliment dels déus' i descobreix que Hondures va ser on els europeus van conèixer la xocolata (4t viatge de Colom a [Guanaja](https://en.wikipedia.org/wiki/Guanaja)).

    Gaudeix d'una xerrada sobre la història del cacau, tasta begudes tradicionals i relaxa't a la terrassa panoràmica durant la posta de sol.
  tips:
    - "⏰ Obert de dilluns a dissabte de 12:00 a 18:00. Tancat els diumenges."
    - "🍫 Prova la xocolata a l'estil maia (aigua i xili) o tradicional (llet i sucre)."
    - "🌅 Visita-ho a la tarda per gaudir de la posta de sol des de la terrassa panoràmica."
    - "🌿 També venen te orgànic de cacau, moringa, noni, salses picants i artesanies maies."
  links:
