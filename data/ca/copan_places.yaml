- id: macaw
  title: "Macaw Mountain"
  description: "Parc d'aus i reserva natural. Llar de guacamais rescatats, tucans i altres aus tropicals en un preciós entorn natural."
  icon: "fa-solid fa-feather"
  long_description: |
    Santuari i reserva natural dedicat al rescat i rehabilitació d'aus natives d'Hondures. Passeja pel bosc frondós i veus de prop guacamais, tucans, momots i altres espècies tropicals.
  tips:
    - "🎫 Entrada 10$ (L250), 8:00-16:00. Demana entrades a la recepció del teu hotel."
    - "🚗 És a només 10 minuts amb cotxe de la plaça central de Copán Ruinas."
    - "🦜 El primer grup d'aus es va alliberar el 2011. Ara hi ha més de 130 guacamais volant per les ruïnes i la vall."
  links:
    - title: "Informació"
      icon: "fa-solid fa-circle-info"
