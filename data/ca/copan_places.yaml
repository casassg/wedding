- id: shopping
  title: "Artesanies Locals"
  description: "Explora ceràmica d'inspiració maia, joies de jade, tèxtils i records artesanals a les botigues i mercats del poble."
  icon: "fa-solid fa-bag-shopping"
  long_description: |
    El centre del poble i el mercat ofereixen artesanies autèntiques d'inspiració maia, joies de jade, ceràmica pintada a mà i productes locals. No et perdis el famós cafè de Copán, la xocolata artesanal i els productes a base de cacau; són regals perfectes per endur-se a casa.

    També destaquen les seves increïbles espelmes artesanals de totes les formes i aromes: amb forma de cafè que fan olor de cafè, amb forma de llimona que fan olor de llimona, i molts més dissenys creatius!
  tips:
    - "🎨 Busca joies de jade d'inspiració maia i ceràmica pintada a mà."
    - "🕯️ Descobreix les espelmes artesanals úniques: amb forma i aroma de cafè, de llimona i d'altres!"
    - "☕ No et perdis el cafè, la xocolata i els productes de cacau local; són regals perfectes."
  links:
    - label: "Google Maps"
      url: "https://maps.app.goo.gl/s52ejd71yUUCpuiJ6"
      icon: "fa-solid fa-map-location-dot"
    - label: "Instagram"
