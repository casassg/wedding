- id: cafe
  title: "Café San Rafael"
  description: "Una empresa familiar 100% hondurenya al cor de Copán Ruinas que ofereix cafè d'especialitat, formatges artesanals d'inspiració europea i vins."
  icon: "fa-solid fa-seedling"
  long_description: |
    San Rafael Family Estates combina el cultiu de cafè des de 1985 a les finques Managuá i San Rafael amb la producció làctia artesanal a la Finca Santa Clara. La seva botiga principal, al centre de Copán Ruinas, ofereix cafè d'especialitat, una selecció única de formatges artesanals naturals (inspirats en tradicions europees), vins i productes locals.

    Tots els formatges s'elaboren de manera natural, sense additius ni conservants.
  tips:
    - "☕ Famós pel seu cafè gurmet i els formatges artesanals únics a Hondures."
    - "🧀 Prova els seus formatges d'inspiració europea fets amb llet de vaques Bruna dels Alps de pastura."
    - "🛍️ Passa-hi a comprar encara que no hi mengis; tenen un cafè i un formatge excel·lents per endur."
    - "⏰ Obert de dilluns a dissabte de 8:00 a 21:00, i diumenge de 8:00 a 16:00. Els grups de més de 10 persones han de reservar."
  links:
