- id: ruins
  title: "Ruïnes de Copán"
  description: "Explora l'antiga ciutat maia, amb la famosa Escalinata dels Jeroglífics, la Gran Plaça i nombroses esteles. No et perdis el Museu d'Escultures!"
  icon: "fa-solid fa-monument"
  long_description: |
    Capital d'un poderós regne maia multiètnic entre el 426 i el 822 dC, Copán és [Patrimoni de la Humanitat de la UNESCO](https://whc.unesco.org/en/list/129/) des de 1980. Destaca per la seva excepcional escultura en pedra, com la famosa [Escalinata dels Jeroglífics](https://en.wikipedia.org/wiki/Hieroglyphic_Stairway) —el text maia conegut més extens—, així com per les esteles, els altars i els alts relleus.

    Gairebé 4 km de túnels arqueològics sota l'acròpolis han revelat temples anteriors, tombes i façanes d'estuc.
  tips:
    - "🎟️ Contracta un guia a l'entrada (~50 $ per grup); t'explicarà històries que no surten a les guies."
    - "⏰ Ves-hi a les 8:00, només obrir, per evitar la calor i les multituds."
    - "🏛️ Deixa el Museu d'Escultures per al final; l'apreciaràs més després de visitar les ruïnes."
    - "💵 Entrada: Parc i Sepultures 20 $, Túnels 15 $, Museu d'Escultura 10 $ (estrangers). Preu reduït per a centreamericans. [Tarifes oficials](https://ihah.hn/parque-arqueologico-copan/)."
  links:
    - title: "Informació"
      icon: "fa-solid fa-circle-info"
      links:
        - label: "Web Oficial"
          url: "https://ihah.hn/parque-arqueologico-copan/"
          icon: "fa-solid fa-globe"
        - label: "Patrimoni UNESCO"
          url: "https://whc.unesco.org/es/list/129/"
          icon: "fa-solid fa-landmark"
    - title: "Recerca"
      icon: "fa-solid fa-microscope"
      links:
        - label: "Recerca Harvard"
          url: "https://peabody.harvard.edu/cmhi-historic-photo-board-digitization-project"
          icon: "fa-solid fa-microscope"
        - label: "Projecte Túnels"
          url: "https://peabody.harvard.edu/copan-acropolis-tunnel-conservation-plan-project"
          icon: "fa-solid fa-archway"
    - title: "Explora"
      icon: "fa-solid fa-compass"
      links:
