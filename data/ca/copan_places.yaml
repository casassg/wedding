- id: sunflowers
  title: "Camps de Gira-sols"
  description: "Preciosos camps de gira-sols que floreixen tot l'any! Gaudeix del paisatge, les hamaques, el restaurant, el cafè local i els gelats."
  icon: "fa-solid fa-sun-plant-wilt"
  long_description: |
    El Paseo de los Girasoles ofereix més que fotos: relaxa't a les hamaques, gaudeix del brunch o d'un dinar al restaurant, assaboreix cafè de torrefactors locals de Copán i gaudeix d'un gelat envoltat de gira-sols infinits.
  tips:
    - "🌻 Els gira-sols floreixen tot l'any, però consulta la seva pàgina de Facebook per veure l'estat actual."
    - "☕ Gaudeix de les hamaques, del restaurant, del cafè local i del gelat al mateix recinte."
    - "📸 Perfecte per fer fotos; ves-hi d'hora al matí per tenir millor llum."
  links:
    - label: "Google Maps"
      url: "https://maps.app.goo.gl/JGNCeucsXwKCnWQN6"
