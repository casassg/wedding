- id: hotsprings
  title: "Aigües Termals Luna Jaguar"
  description: "Aigües termals naturals a 22 km del poble amb múltiples piscines, tours guiats i spa temàtic maia. Cal reservar!"
  icon: "fa-solid fa-hot-tub-person"
  long_description: |
    Luna Jaguar ofereix una experiència de spa completa amb diverses piscines termals a diferents temperatures, envoltades d'exuberant vegetació tropical. L'ambientació d'estil maia hi dona un toc màgic. L'entrada inclou accés a totes les instal·lacions i un tour guiat.
  tips:
    - "📅 Cal reservar! Aforament limitat. Fes-ho per WhatsApp o a través del web."
    - "⏰ Obert cada dia de 13:00 a 21:00 (última entrada 19:00). Adults 15$, nens (5-11) 5$, menors de 5 gratis."
    - "🚐 50 min en cotxe. Usa [transport Copan Card](https://copancard.com): 40$/persona, surt a les 14:00 i torna a les 20:00."
    - "🍽️ La cafeteria només té snacks envasats. Gratis: taquilles, pàrquing, dutxes, WiFi."
  links:
