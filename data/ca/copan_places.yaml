- id: butterflies
  title: "Papallonari"
  description: "Un santuari on pots caminar entre centenars de papallones de colors dins d'un jardí tancat."
  icon: "fa-solid fa-dove"
  long_description: |
    Ubicat a l'[Hotel Mayan Hills Resort](https://www.mayanhills.com/) (a 5 min de les ruïnes), aquest encantador papallonari presenta espècies des de la llegendària morpho blava fins a la majestuosa papallona monarca. Observa la metamorfosi en acció, interactua amb aquestes delicades criatures i fes fotos inoblidables mentre se us posen a sobre.
  tips:
    - "🦋 Les millors fotos surten al matí, quan les papallones estan més actives."
    - "📍 A l'Hotel Mayan Hills Resort; combina-ho amb un dinar al seu restaurant."
    - "⏱️ Dedica 30-45 minuts a la visita completa."
    - "📸 Pots interactuar amb les papallones i fer-t'hi fotos."
  links:
    - label: "Web Oficial"
      url: "https://www.mayanhills.com/mariposario/"
      icon: "fa-solid fa-globe"
    - label: "Google Maps"
