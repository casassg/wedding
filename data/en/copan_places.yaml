- id: chocolate
  title: "Tea & Chocolate Place"
  description: "Interactive cacao museum run by an archaeologist's family. Learn Maya chocolate traditions, taste authentic beverages, and enjoy sunset views from the terrace."
  icon: "fa-solid fa-mug-hot"
  long_description: |
    Run by archaeologist David Sedat and his daughter Carolina, this unique space is part museum, part tasting experience. Learn how the Maya revered cacao as 'food of the gods' - and that Honduras was where Europeans first encountered chocolate (Columbus' 4th voyage at Guanaja).

    Enjoy a briefing on cacao history, sample traditional beverages, and relax on the wrap-around terrace at sunset.
  tips:
    - "⏰ Open Mon-Sat 12pm-6pm. Closed Sundays."
    - "🍫 Try Maya-style chocolate (water + chile) or traditional (milk + sugar)."
    - "🌅 Visit late afternoon for sunset views from the wrap-around terrace."
    - "🌿 Also sells organic teas, moringa, noni products, hot sauces, and Maya handicrafts."
  links:
