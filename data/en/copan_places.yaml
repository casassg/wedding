- id: cafe
  title: "Café San Rafael"
  description: "A 100% Honduran family business in the heart of Copán Ruinas, offering specialty coffee, European-inspired artisan cheeses, and wines."
  icon: "fa-solid fa-seedling"
  long_description: |
    San Rafael Family Estates combines coffee farming since 1985 at Finca Managuá and Finca San Rafael with artisan dairy production at Finca Santa Clara. Their main store in central Copán Ruinas offers specialty coffee drinks, a unique selection of natural artisan cheeses (inspired by European traditions), wines, and local products.

    All cheeses are made naturally without additives or preservatives.
  tips:
    - "☕ Famous for gourmet coffee and hand-made artisan cheeses found nowhere else in Honduras."
    - "🧀 Try their European-inspired cheeses made from free-range Pardo Suizo cows."
    - "🛍️ Stop to shop even if you don't dine - great coffee and cheese to bring home."
    - "⏰ Open Mon-Sat 8am-9pm, Sun 8am-4pm. Groups of 10+ should reserve ahead."
  links:
