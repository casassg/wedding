- id: ruins
  title: "Copán Ruins"
  description: "Explore the ancient Maya city with its famous Hieroglyphic Stairway, Great Plaza, and intricate stelae. Don't miss the sculpture museum!"
  icon: "fa-solid fa-monument"
  long_description: |
    Capital of a powerful multi-ethnic Maya kingdom from 426 to 822 CE, Copán has been a UNESCO World Heritage Site since 1980. Renowned for its exceptional stone sculpture, the site features the famous Hieroglyphic Stairway—the longest known Maya text—along with intricate stelae, altars, and 3D carvings.

    Nearly 4km of archaeological tunnels beneath the acropolis have revealed earlier temples, tombs, and stucco facades.
  tips:
    - "🎟️ Hire a guide at the entrance (~$50 split among group) - they share stories not in guidebooks."
    - "⏰ Arrive at 8am opening to beat the heat and crowds."
    - "🏛️ Visit Sculpture Museum last - you'll appreciate it more after seeing the ruins."
    - "💵 Entry: Park+Sepulturas $20, Tunnels $15, Sculpture Museum $10 (foreigners). Central Americans pay less. [Official prices](https://ihah.hn/parque-arqueologico-copan/)."
  links:
    - title: "Info"
      icon: "fa-solid fa-circle-info"
      links:
