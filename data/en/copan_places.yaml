- id: shopping
  title: "Local Artesanías"
  description: "Browse handcrafted Maya-inspired pottery, jade jewelry, textiles, and souvenirs in the town's shops and markets."
  icon: "fa-solid fa-bag-shopping"
  long_description: |
    The town center and market offer authentic Maya-inspired crafts, jade jewelry, hand-painted pottery, and local products. Don't miss the famous Copán coffee, artisan chocolate, and cacao-based products - perfect gifts for home.

    A highlight is their amazing handmade candles in all shapes and scents - coffee-shaped candles that smell like coffee, lemon-shaped ones with lemon scent, and many more creative designs!
  tips:
    - "🎨 Look for Maya-inspired jade jewelry and hand-painted pottery."
    - "🕯️ Check out the unique artisan candles - shaped and scented like coffee, lemons, and more!"
    - "☕ Don't miss local coffee, chocolate, and cacao products - perfect gifts for home."
  links:
