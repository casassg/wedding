- question: "❤️ Why Copan?"
  answer: "Copán was one of the first places we visited together as a couple, when Gerard came to Honduras for the first time. We both fell in love with this place and it means so much to us. Besides, it's a beautiful town with lots of [activities and places to visit](/traveling/)."

- question: "✈️ How do I get to Copán?"
  answer: "Fly into San Pedro Sula (SAP): it's the closest international airport to Copán. Check our [travel page](/traveling/) for flight options from Europe and the US/Canada. To get from the airport to San Pedro Sula, many hotels in San Pedro Sula include airport transfers; contact your hotel when booking to make sure. Otherwise, you can use official airport taxis or Uber. If using Uber, verify the driver and plate before getting in. Avoid unknown street taxis. Once you're in San Pedro Sula, see the next question for how to get to Copán."

- question: "🚌 How do I get from San Pedro Sula to Copán?"
  answer: "We're providing a shuttle for guests traveling from abroad, and we recommend taking it! It picks you up in San Pedro Sula or at the SAP airport on both Thursday and Friday before the wedding, and takes you back to San Pedro Sula or the airport on Sunday morning or afternoon. If none of these options work for you, we recommend booking a private transfer with our trusted local provider, [Chelsy Tours](/traveling/#transport-provider), who can also pick you up at the airport. If you're staying overnight in San Pedro Sula, your hotel may also offer pickup and/or drop-off from the SAP airport. We don't recommend driving or renting a car, but if you do rent one, it's better not to travel from San Pedro Sula to Copán after 3pm: traffic leaving the city is heavy until 8pm, and driving at night can be tricky because of animals on the road."

- question: "🗺️ Where can I travel in Honduras? Can someone help me plan?"
  answer: "Yes! Our trusted travel agent, Maureen Alfaro from D'Mundo Travel, can help you book vacation packages around Honduras and hotels in Copán. Mention code **Casas Paz** for 5% off! [Contact her here](/traveling/#travel-agent)."

- question: "🌤️ What will the weather be like?"
  answer: "Expect beautiful spring-like weather! Days are pleasant (around 25°C/77°F) and evenings are cool (around 16°C/61°F). December is the start of the dry season, so rain is unlikely. We recommend bringing a light jacket or sweater for the evenings."

- question: "👗 What's the dress code?"
  answer: "**Formal.** We want everyone to look their best to celebrate together. Come ready to dance and have fun! Men: A dark colored suit with shirt, optional tie/bowtie, and nice shoes. Women: A floor-length gown, a fancy cocktail dress, or a dressy pantsuit."

- question: "💄 Where can I get hair and makeup done in Copán for the wedding?"
  answer: "**Maybely Aguirre Studio** was recommended to us by someone who lives in Copán for makeup and hair styling. You can reach Maybely through her [Instagram](https://www.instagram.com/maybelyaguirrestudio) to book an appointment."

- question: "🌍 What if I can't make it to Honduras?"
  answer: "No worries, we understand it's difficult! This is why in spring 2027, we'll host a relaxed celebration in Catalonia. No ceremony - just celebration and friends. More details soon!"

- question: "🍹 Will there be something on Friday?"
  answer: "We'll likely meet up for drinks the night before at a bar in Copan Ruinas for those who arrive early. Stay tuned for details!"

- question: "🛡️ Is it safe to travel to Honduras?"
  answer: "While Honduras has a complex reputation, **Copán Ruinas is considered one of the safest and most tranquil tourist destinations** in the country. We recommend reading our [travel guide](/traveling/) for more information. As with any tourist destination, we recommend using common sense and not wearing flashy jewelry."

- question: "🦟?"
  answer: "Mosquitos are common in tropical areas like Honduras, less so in December but they're always around. We strongly recommend bringing **bug spray/repellent** to prevent bites (Dengue is present in the country). Read our [travel guide](/traveling/) for more information."

- question: "🎁 Wedding Registry?"
  answer: "We are beyond happy to have you here! Seriously just please show up ❤️ but if you would _really_ like to get us something, you can help make our first trip as a married couple truly unforgettable **[here 😊](https://donate.stripe.com/eVq5kCgIz9qdfLycrd0Ny00?locale=en)**. _Old school?_ We'll happily accept envelopes at the wedding as well 💌."

- question: "🏨 Is there a room block?"
  answer: "Yes! Check out our [Where to Stay section](/traveling/#where-to-stay) for available options, rates, and how to book."
