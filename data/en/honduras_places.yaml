- id: tegucigalpa
  title: "Tegucigalpa"
  description: "Honduras's mountain capital at 1,000m elevation, with colonial architecture, lively markets, and nearby cloud forests. Just outside the city: colonial mountain towns, a Christ-the-Redeemer-style viewpoint, and great food."
  icon: "fa-solid fa-city"
  long_description: |
    Founded in 1578 on the slopes of Mount Picacho, Tegucigalpa is Honduras's political capital and a city of contrasts. The historic center features the 18th-century [Cathedral of San Miguel](https://en.wikipedia.org/wiki/Cathedral_of_Saint_Michael_the_Archangel,_Tegucigalpa), the National Art Gallery in the former Paraninfo building, and the bustling Mercado San Isidro. The [Basílica de Suyapa](https://en.wikipedia.org/wiki/Basilica_of_Our_Lady_of_Suyapa), dedicated to Honduras's tiny patron saint statue, draws pilgrims year-round, especially during the February 3 festival.

    Three little towns share the same road just 30 minutes from the city. **[Valle de Ángeles](https://en.wikipedia.org/wiki/Valle_de_%C3%81ngeles)** is a beautifully preserved colonial mountain town famous for its handicrafts, cobblestone streets, and weekend artisan markets. **San Juancito** is a former mining town, and **Santa Lucía** offers the best views over the valley.

    Closer to the city, the **Cristo del Picacho** is Tegucigalpa's smaller take on Rio's Christ the Redeemer: a hilltop statue with panoramic views, restaurants, and wine spots, about 15 minutes from downtown. About 40 minutes out, **Finca La Catadora** is a quirky blackberry vineyard with great food and views. For outdoor lovers, **[La Tigra National Park](https://en.wikipedia.org/wiki/La_Tigra_National_Park)** is a cloud forest with excellent hiking trails, one of Honduras's oldest protected areas.

    Back in the city, **9 Patrias** serves a 7-course tasting menu born from a university gastronomy program: local ingredients inspired by ancient Honduran tribes, like fish cooked with cacao, with every dish explained, a Michelin-style experience at a friendlier level. For history, don't miss the [Museum of National Identity](https://share.google/adcS2XJ4qalKy4lGi).
  tips:
    - "🌿 La Tigra National Park is just 30 minutes from the city center."
    - "☕ Coffee picks in the city: Nativo, Cafetano, Plácido, La Montaña, Varietal, TGP, Crepería, Aroma."
    - "☕ In the mountain towns: Varietal in Valle de Ángeles; La Casa del Té and Tres Puntos in Santa Lucía."
    - "🌲 Mountain towns are cooler than the city, bring a light jacket."
