- id: tela
  title: "Tela"
  description: "A Caribbean beach town with must-see attractions: [Punta Sal National Park](https://en.wikipedia.org/wiki/Jeannette_Kawas_National_Park) with pristine beaches, [Lancetilla Botanical Garden](https://en.wikipedia.org/wiki/Lancetilla_Botanical_Garden) (Latin America's largest, just 5 min away), plus resorts and beach clubs."
  icon: "fa-solid fa-umbrella-beach"
  long_description: |
    Tela offers beautiful Caribbean beaches and diverse experiences. Punta Sal ([Jeannette Kawas National Park](https://en.wikipedia.org/wiki/Jeannette_Kawas_National_Park)) features pristine beaches and wildlife. [Playa Miami](https://www.google.com/maps/place/Playa+Miami/@15.7694,-87.4427,16z/) has calm waters perfect for families.

    [Lancetilla Botanical Garden](https://en.wikipedia.org/wiki/Lancetilla_Botanical_Garden), founded in 1926, spans 1,600 hectares with over 1,500 plant species - just 5 minutes from town. [Indura Resort](https://www.induraresort.com/) offers luxury and golf, while [La Ensenada Beach Club](https://www.google.com/maps/place/La+Ensenada+Beach+Resort/@15.7903,-87.4825,15z/) and [Hotel Telamar](https://www.google.com/maps/place/Villas+Telamar/@15.7756,-87.4593,16z/) provide beachfront relaxation.
  tips:
    - "🏖️ Punta Sal has pristine beaches and wildlife - book a boat tour."
    - "🌿 Lancetilla Botanical Garden is Latin America's largest - just 5 min away."
    - "🥥 Try fresh coconut from beach vendors and Garifuna coconut bread."
