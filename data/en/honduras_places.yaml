- id: puerto_cortes
  title: "Puerto Cortés & Omoa"
  description: "Honduras's main Caribbean port city with a beautiful historic center, and the nearby beach town of Omoa with its stunning 18th-century fortress and incredible seafood, just 20-40 minutes from the airport."
  icon: "fa-solid fa-anchor"
  long_description: |
    Puerto Cortés is Honduras's principal Caribbean port and a city with deep history. Founded in the 16th century, it became one of Spain's most important colonial ports, shipping silver, indigo, and other goods back to Europe. Today, the [historic center](https://www.youtube.com/watch?v=QBRrNOe4tVY) preserves colorful colonial-era wooden houses and a lively malecón.

    Just 20 minutes south is **Omoa**, a laid-back beach town where the main attraction is the [San Fernando de Omoa Fortress](https://en.wikipedia.org/wiki/Fortaleza_de_San_Fernando), an imposing 18th-century Spanish colonial fortress built to protect the coast from pirates, now housing a small museum. The beaches in Omoa have calm waters perfect for swimming, and the *comidas típicas* (fried fish, shrimp, coconut bread) are some of the best in Honduras.

    [Villas Amelia](https://www.instagram.com/villas.amelia/) is owned by a friend of ours, perfect to stay or to visit.
  tips:
    - "🏰 Don't miss the San Fernando Fortress in Omoa, one of Honduras's most important colonial sites."
    - "🐟 Try the fried fish and shrimp on Omoa beach, some of the best seafood in the country."
    - "🏘️ Explore Puerto Cortés's historic center with its colorful colonial wooden houses."
    - "📍 Puerto Cortés is 20 min from SAP airport; Omoa is 40 min, a perfect stopover to/from Copán."
    - "🚢 Watch cargo ships from the Puerto Cortés malecón, one of Central America's busiest ports."
