- id: roatan
  title: "Roatán"
  description: "The largest Bay Island with world-class diving, pristine Caribbean beaches, and incredible wildlife. Just 40 minutes by boat, the protected Cayos Cochinos islands offer untouched coral reefs, endemic pink boas, and authentic Garífuna fishing villages."
  icon: "fa-solid fa-water"
  long_description: |
    West Bay Beach consistently ranks among the Caribbean's best beaches, with pristine sand and reef just offshore. West End is the main tourist hub with dive shops, restaurants, and nightlife. The reef is protected by the [Roatan Marine Park](https://www.roatanmarinepark.org/), a nonprofit running coral restoration programs - you can visit their Coral Restoration Center or join a lionfish hunting workshop.

    Don't miss the wildlife sanctuaries: [Daniel Johnson's Monkey & Sloth Hangout](https://monkeyandslothhangout.com/) for up-close animal encounters, and [Gumbalimba Park](https://roatan.online/gumbalimba-park) for ziplines and wildlife. The [Roatan Chocolate Factory](https://roatan.online/roatan-chocolate-factory) offers free tours showcasing bean-to-bar production. For adventure, explore mangrove tunnels on the quieter east end, or relax at Camp Bay's secluded beaches.

    Just 40 minutes by boat, **Cayos Cochinos** is a pristine marine sanctuary managed by the [Fundación Cayos Cochinos](https://www.cayoscochinos.org/), protecting some of the most intact coral reefs in the Caribbean. Visitors can hike to spot the endemic pink boa constrictor on Cayo Mayor, snorkel over virgin reef, and experience authentic Garífuna culture at the fishing village of Chachahuate. The Fundación runs active coral restoration and sea turtle conservation programs, making it one of the most meaningful eco-destinations in Honduras.
  tips:
    - "🏊 Best snorkeling at West Bay Beach - reef is a short swim from shore."
    - "🐠 Use reef-safe sunscreen to help protect the coral reef."
    - "🛳️ Avoid buying when cruise ships dock - prices double or triple."
    - "🦟 Apply strong insect repellent (e.g. DEET) often - sand fleas bite without warning."
    - "🛥️ Cayos Cochinos is 40 min by boat from Roatán - a day trip to pristine reef and pink boas."
    - "🐍 Take a guided hike on Cayo Mayor to spot the endemic pink boa constrictor."
    - "🏘️ Visit Chachahuate cay for authentic Garífuna food, culture, and a marine protected area experience."
