- id: san_pedro
  title: "San Pedro Sula"
  description: "Honduras's industrial capital and gateway to amazing day trips. Explore El Cusuco National Park, hike Angeli Gardens trails, shop at Guamilito artisan market, or visit the stunning hydrangea fields of El Merendón."
  icon: "fa-solid fa-city"
  long_description: |
    The second largest city offers excellent day trip options within 100km. [El Cusuco National Park](https://en.wikipedia.org/wiki/Cusuco_National_Park) is a cloud forest biological reserve with incredible biodiversity.

    [Angeli Gardens](https://www.instagram.com/angeligardens/) offers hiking trails and canopy ziplines. [Guamilito Market](https://www.google.com/maps/place/Guamilito+Market/@15.5026,-88.0284,17z/) is the place for authentic Honduran crafts. El Merendón features beautiful hydrangea fields and La Coca Cola hiking trail.
  tips:
    - "🌺 Visit the hydrangea fields of El Merendón in bloom season."
    - "🛍️ Guamilito Market for authentic Honduran handicrafts."
    - "🌿 El Cusuco National Park has cloud forest with incredible biodiversity."
    - "☕ Coffee picks in San Pedro Sula: Welchez, Backup, Mezcal, TGP, Cafeteo. In Peña Blanca: Dorao."
