      icon: "fa-solid fa-book"

- id: ceiba
  title: "La Ceiba"
  description: "Honduras's 'Entertainment Capital' and gateway to the Bay Islands, set dramatically at the foot of [Pico Bonito](https://en.wikipedia.org/wiki/Pico_Bonito_National_Park) (2,435m). Home to the country's biggest festival - the [Gran Carnaval Internacional](https://en.wikipedia.org/wiki/La_Ceiba_Carnival) every May - plus world-class rafting, a vibrant [Garífuna](https://en.wikipedia.org/wiki/Garifuna) community, and legendary nightlife."
  icon: "fa-solid fa-masks-theater"
  long_description: |
    Named after a giant ceiba tree that once grew near the old docks, La Ceiba developed as a banana port in the late 1800s under the Vaccaro Brothers (now Dole). Today it's the eco-tourism hub of Honduras.

    Key attractions include: [Pico Bonito National Park](https://en.wikipedia.org/wiki/Pico_Bonito_National_Park) with rainforest trails, waterfalls, and incredible biodiversity; the [Cangrejal River](https://en.wikipedia.org/wiki/Cangrejal_River) for Class III-IV whitewater rafting just east of town; and [Cuero y Salado Wildlife Refuge](https://en.wikipedia.org/wiki/Cuero_y_Salado_Wildlife_Refuge) to the west, where you can spot wild manatees.

    The ferry port connects to Roatán and Utila daily. The Zona Viva on Calle 1 is the nightlife district. Barrio La Isla, across the river estuary, is home to a thriving Garífuna community.
  tips:
    - "⛴️ Gateway to Bay Islands - ferries leave twice daily to Roatán and Utila."
    - "🎭 Carnaval (3rd Saturday of May) draws 500,000+ people - not during our December trip, but Honduras's biggest party!"
    - "🌊 World-class Class III-IV whitewater rafting on the Cangrejal River."
    - "🦭 Cuero y Salado Wildlife Refuge has wild manatees - boat tours available."
    - "🦋 Museum of Butterflies and Insects has 12,000+ specimens from 68 countries."
    - "🌿 Pico Bonito National Park has excellent rainforest hikes and waterfalls."
  links:
    - label: "Wikipedia"
      url: "https://en.wikipedia.org/wiki/La_Ceiba"

- id: yojoa
  title: "Lake Yojoa"
  description: "Honduras's largest lake, surrounded by cloud forests and home to over 400 bird species. Artisan chocolate tours, eco-parks, and world-class birdwatching, plus the stunning Taulabé Caves and Pulhapanzak Waterfall nearby."
  icon: "fa-solid fa-dove"
  long_description: |
    Located 80km from San Pedro Sula, this stunning lake offers diverse attractions: artisan chocolate experiences at [Yojoa Chocolate](https://yojoachocolate.com/) and [Luna del Puente](https://www.instagram.com/lunadelpuente/) (bean-to-bar tours); [Bioparque Paradise](https://www.hondurastips.hn/2013/07/29/bioparque-paradise-los-naranajos/) (78-hectare eco-park with trails, waterfalls, and Lenca archaeological ruins); [PANACAM Lodge](https://www.panacamlodge.com/) in [Cerro Azul Meámbar National Park](https://en.wikipedia.org/wiki/Cerro_Azul_Me%C3%A1mbar_National_Park) (mountain lodge with nature trails, birdwatching towers, and panoramic views); [D&D Brewery](https://ddbrewery.com/) (Honduras's first microbrewery with guided birding tours); Parque Los Naranjos eco-trails; Hotel Finca Las Glorias for local cuisine; Honduyate boat tours; [Lagolandia](https://www.instagram.com/lagolandiahn/) water park; and Los Domos de Agualpa glamping domes with spectacular lake views.

    The region also offers two epic nature stops along the main highway: the **Taulabé Caves**, limestone caves extending for kilometers underground with spectacular stalactites and stalagmites on illuminated walkways, a perfect cool escape from the heat; and **Pulhapanzak**, one of Central America's most beautiful waterfalls, 43 meters of water plunging into a natural pool surrounded by lush tropical forest, where you can rappel behind the falls, swim in the natural pools, and spot macaws on nearby trails.
  tips:
    - "🍺 Visit D&D Brewery - Honduras's first microbrewery."
    - "🍫 Take a chocolate tour - learn bean-to-bar production from local cacao farms."
    - "🐟 Try fried tilapia 'Lake Yojoa Style' at roadside restaurants."
    - "🐦 Over 400 bird species - bring binoculars!"
    - "🌡️ Both are great hot-day escapes: Taulabé stays cool underground, Pulhapanzak has a misty pool."
    - "🧗 At Pulhapanzak you can rappel behind the 43m waterfall (guided tours, extra fee)."
    - "👟 Wear good walking shoes for both; the caves have walkways, the falls have trails."
    - "📍 Both are on the main road: Taulabé ~1h from Copán, Pulhapanzak ~1.5h."
    - "🦜 Pulhapanzak is a great spot for macaw sightings."
