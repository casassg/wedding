- id: utila
  title: "Utila"
  description: "The smallest Bay Island with a laid-back 'boho' vibe, world-class diving on the [Mesoamerican Barrier Reef](https://en.wikipedia.org/wiki/Mesoamerican_Barrier_Reef_System), and one of the best places in the world to spot whale sharks - December is peak season! Home to the endemic Swamper iguana found nowhere else on Earth."
  icon: "fa-solid fa-fish"
  long_description: |
    A backpacker paradise and diver's haven, Utila offers some of the cheapest [PADI](https://www.padi.com/) certifications in the Caribbean. No cars are allowed - get around by tuk-tuk, ATV, or golf cart.

    Highlights include: [Airport Caves](https://www.google.com/maps/place/Airport+Caves/@16.1048,-86.9268,17z/) for incredible shore snorkeling with caves and canyons (intermediate swimmers); Neptune's at [Coral Beach Village](https://www.coralbeachutila.com/) (boat access) for beach days and great snorkeling; [Water Caye](https://www.google.com/maps/place/Water+Cay/@16.1294,-86.8794,15z/) for a pristine uninhabited island day trip; [Pumpkin Hill](https://www.google.com/maps/place/Pumpkin+Hill/@16.1165,-86.9488,16z/) for a short hike to the island's highest point; and the [Utila Chocolate Company](https://www.instagram.com/utilachocolate/) for artisan bean-to-bar tastings.
  tips:
    - "🦈 December is prime whale shark season - perfect timing for the wedding trip!"
    - "💰 One of the cheapest places in the world for PADI dive certification."
    - "⛴️ Ferry from Roatan (1hr) or La Ceiba - [utilaferry.com](https://utilaferry.com/) is one place to book."
    - "🤿 Airport Caves has amazing shore snorkeling - intermediate skill required."
    - "💵 Cash is king - bring lempiras or US dollars."
  links:
    - label: "Wikipedia"
      url: "https://en.wikipedia.org/wiki/Utila"
