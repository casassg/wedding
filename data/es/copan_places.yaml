- id: sunflowers
  title: "Campos de Girasoles"
  description: "¡Hermosos campos de girasoles que florecen todo el año! Disfruta del paisaje, las hamacas, el restaurante y el café local."
  icon: "fa-solid fa-sun-plant-wilt"
  long_description: |
    El Paseo de los Girasoles ofrece mucho más que fotos: relájate en sus hamacas, disfruta de un brunch o almuerzo en el restaurante, saborea el café de productores locales de Copán y date un gusto con un helado rodeado de girasoles.
  tips:
    - "🌻 Los girasoles florecen todo el año, pero consulta su página de Facebook para ver el estado actual."
    - "☕ Disfruta de las hamacas, el restaurante, el café local y los helados en el mismo lugar."
    - "📸 Lugar perfecto para fotos; llega temprano por la mañana para aprovechar la mejor luz."
  links:
