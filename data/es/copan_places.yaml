- id: ruins
  title: "Ruinas de Copán"
  description: "Explora la antigua ciudad maya, famosa por su Escalinata de los Jeroglíficos, la Gran Plaza y sus intrincadas estelas. ¡No dejes de visitar el Museo de Escultura!"
  icon: "fa-solid fa-monument"
  long_description: |
    Capital de un importante reino maya entre los años 426 y 822 d.C., Copán es [Patrimonio de la Humanidad de la UNESCO](https://whc.unesco.org/en/list/129/). Destaca por su excepcional arte en piedra, incluyendo la [Escalinata de los Jeroglíficos](https://en.wikipedia.org/wiki/Hieroglyphic_Stairway) (el texto maya más extenso conocido), así como por sus impresionantes estelas y altares en alto relieve.

    Además, su red de túneles bajo la acrópolis revela templos antiguos y fachadas ocultas.
  tips:
    - "🎟️ Contrata un guía en la entrada (~$50 por grupo); comparten historias y secretos que no están en los libros."
    - "⏰ Llega a las 8:00 am (hora de apertura) para evitar el calor y las multitudes."
    - "🏛️ Deja el Museo de Escultura para el final; disfrutarás más del arte tras haber recorrido el sitio."
    - "💵 Entradas (extranjeros): Parque + Sepulturas $20, Túneles $15, Museo $10. Tarifas reducidas para centroamericanos. [Ver precios oficiales](https://ihah.hn/parque-arqueologico-copan/)."
  links:
    - title: "Información"
      icon: "fa-solid fa-circle-info"
      links:
        - label: "Web Oficial"
          url: "https://ihah.hn/parque-arqueologico-copan/"
          icon: "fa-solid fa-globe"
        - label: "Patrimonio UNESCO"
          url: "https://whc.unesco.org/es/list/129/"
          icon: "fa-solid fa-landmark"
    - title: "Investigación"
      icon: "fa-solid fa-microscope"
      links:
        - label: "Investigación Harvard"
          url: "https://peabody.harvard.edu/cmhi-historic-photo-board-digitization-project"
          icon: "fa-solid fa-microscope"
        - label: "Proyecto Túneles"
          url: "https://peabody.harvard.edu/copan-acropolis-tunnel-conservation-plan-project"
          icon: "fa-solid fa-archway"
    - title: "Explorar"
      icon: "fa-solid fa-compass"
