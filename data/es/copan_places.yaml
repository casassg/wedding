- id: shopping
  title: "Artesanías Locales"
  description: "Explora la cerámica de inspiración maya, joyería de jade, textiles y recuerdos artesanales en las tiendas y mercados del pueblo."
  icon: "fa-solid fa-bag-shopping"
  long_description: |
    El centro del pueblo y el mercado ofrecen auténticas artesanías de inspiración maya, joyería de jade, cerámica pintada a mano y productos locales. No te pierdas el famoso café de Copán, el chocolate artesanal y los productos derivados del cacao, ideales para llevar a casa.

    Destacan especialmente sus velas artesanales en formas creativas (como granos de café o limones) que conservan sus respectivos aromas.
  tips:
    - "🎨 Busca joyería de jade de inspiración maya y cerámica pintada a mano."
    - "🕯️ Descubre las velas artesanales únicas, ¡con forma y aroma de café, limón y más!"
    - "☕ No te pierdas el café, el chocolate y los productos de cacao local; son regalos perfectos."
  links:
