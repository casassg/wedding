- id: cafe
  title: "Café San Rafael"
  description: "Empresa familiar 100% hondureña en el corazón de Copán Ruinas, que ofrece café de especialidad, vinos y quesos artesanales de inspiración europea."
  icon: "fa-solid fa-seedling"
  long_description: |
    San Rafael Family Estates combina el cultivo de café (desde 1985 en Finca Managuá y Finca San Rafael) con la producción láctea artesanal en Finca Santa Clara. Su tienda principal en el centro de Copán Ruinas ofrece café de especialidad, una selección única de quesos artesanales (inspirados en tradiciones europeas), vinos y productos locales.

    Todos los quesos se elaboran de forma natural, sin aditivos ni conservantes.
  tips:
    - "☕ Famoso por su café gourmet y sus quesos artesanales, únicos en Honduras."
    - "🧀 Prueba sus quesos de estilo europeo, hechos con leche de vacas Pardo Suizo de pastoreo."
    - "🛍️ Aunque no te quedes a comer, pasa a comprar café y queso para llevar."
    - "⏰ Abierto de lunes a sábado 8am-9pm, domingo 8am-4pm. Grupos de 10+ deben reservar."
