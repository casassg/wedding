- id: hotsprings
  title: "Aguas Termales Luna Jaguar"
  description: "Aguas termales naturales a 22km del pueblo, con múltiples piscinas, tours guiados y spa temático maya. ¡Reservación obligatoria!"
  icon: "fa-solid fa-hot-tub-person"
  long_description: |
    Luna Jaguar ofrece una experiencia de spa completa con múltiples piscinas termales a diferentes temperaturas, rodeadas de exuberante vegetación tropical. Su temática maya aporta una atmósfera mágica. La entrada incluye acceso a todas las instalaciones y un tour guiado.
  tips:
    - "📅 ¡Reservación obligatoria! Cupo limitado. Reserva vía WhatsApp o en su página web."
    - "⏰ Abierto todos los días 1pm-9pm (último ingreso 7pm). Adultos $15, niños 5-11 $5, menores de 5 gratis."
    - "🚐 50min en auto - utiliza el [transporte Copan Card](https://copancard.com): $40/persona, sale 2pm, regresa 8pm."
    - "🍽️ La cafetería solo ofrece snacks preenvasados. Gratis: casilleros, estacionamiento, duchas y WiFi."
