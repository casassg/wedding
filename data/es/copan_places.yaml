- id: butterflies
  title: "Mariposario"
  description: "Un santuario donde puedes caminar entre cientos de mariposas coloridas dentro de un jardín tropical cerrado."
  icon: "fa-solid fa-dove"
  long_description: |
    Ubicado en el [Hotel Mayan Hills Resort](https://www.mayanhills.com/) (a 5 min de las ruinas), este encantador mariposario alberga especies que van desde la legendaria morpho azul hasta la majestuosa mariposa monarca. Observa la metamorfosis en acción, interactúa con estas delicadas criaturas y toma fotos inolvidables cuando se posen sobre ti.
  tips:
    - "🦋 Las mejores fotos se consiguen por la mañana, cuando las mariposas están más activas."
    - "📍 Situado en el Hotel Mayan Hills Resort; puedes combinar la visita con un almuerzo en su restaurante."
    - "⏱️ Dedica unos 30-45 minutos para la visita completa."
    - "📸 Puedes interactuar con las mariposas y tomarte fotos con ellas."
  links:
    - label: "Web Oficial"
      url: "https://www.mayanhills.com/mariposario/"
      icon: "fa-solid fa-globe"
