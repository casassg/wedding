- id: macaw
  title: "Macaw Mountain"
  description: "Un parque de aves y reserva natural, hogar de guacamayas rojas rescatadas, tucanes y otras aves tropicales en un hermoso entorno selvático."
  icon: "fa-solid fa-feather"
  long_description: |
    Santuario y reserva natural dedicada al rescate y rehabilitación de aves nativas de Honduras. Recorre el exuberante bosque e interactúa de cerca con guacamayas rojas, tucanes, momotos y otras especies tropicales.
  tips:
    - "🎫 Entrada $10 (L250), 8am-4pm. Pide más información en la recepción de tu hotel."
    - "🚗 Se encuentra a solo 10 minutos en auto de la plaza central de Copán Ruinas."
    - "🦜 El primer grupo de aves fue liberado en 2011. Tras la liberación de junio de 2025, ya hay más de 130 guacamayas volando libremente sobre el valle."
  links:
    - title: "Información"
      icon: "fa-solid fa-circle-info"
