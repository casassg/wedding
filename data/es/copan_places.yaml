- id: chocolate
  title: "Tea & Chocolate Place"
  description: "Museo interactivo del cacao dirigido por la familia de un arqueólogo. Aprende sobre las tradiciones mayas del chocolate, prueba bebidas auténticas y disfruta del atardecer desde la terraza."
  icon: "fa-solid fa-mug-hot"
  long_description: |
    Dirigido por el arqueólogo David Sedat y su hija Carolina, este espacio único es en parte museo y en parte experiencia de degustación. Descubre cómo los mayas veneraban el cacao como 'alimento de los dioses', y aprende que fue en Honduras donde los europeos conocieron el chocolate (durante el 4º viaje de Colón en [Guanaja](https://en.wikipedia.org/wiki/Guanaja)).

    Disfruta de una charla sobre la historia del cacao, prueba bebidas tradicionales y relájate en la terraza panorámica al atardecer.
  tips:
    - "⏰ Abierto de lunes a sábado, 12pm-6pm. Cerrado los domingos."
    - "🍫 Prueba el chocolate estilo maya (agua + chile) o el tradicional (leche + azúcar)."
    - "🌅 Visítalo por la tarde para disfrutar del atardecer desde la terraza."
    - "🌿 También venden tés orgánicos, moringa, noni, salsas picantes y artesanías mayas."
  links:
