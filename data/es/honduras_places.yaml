- id: roatan
  title: "Roatán"
  description: "La mayor de las Islas de la Bahía, con buceo de clase mundial, playas caribeñas de ensueño y santuarios de vida silvestre. A solo 40 minutos en lancha, los Cayos Cochinos ofrecen arrecifes vírgenes, boas rosadas endémicas y auténticas aldeas garífunas."
  icon: "fa-solid fa-water"
  long_description: |
    West Bay Beach figura constantemente entre las mejores playas del Caribe, con arena blanca y el arrecife accesible a nado. West End es el centro turístico principal, lleno de escuelas de buceo, restaurantes y vida nocturna. El arrecife está protegido por el [Roatan Marine Park](https://www.roatanmarinepark.org/), una ONG con programas de restauración de coral (puedes visitar su centro o unirte a talleres de captura de pez león).

    No te pierdas los santuarios de animales: [Daniel Johnson's Monkey & Sloth Hangout](https://monkeyandslothhangout.com/) para ver perezosos y monos, y [Gumbalimba Park](https://roatan.online/gumbalimba-park) para tirolesas (canopy) y naturaleza. La [Fábrica de Chocolate de Roatán](https://roatan.online/roatan-chocolate-factory) ofrece tours gratuitos sobre la elaboración del chocolate. Para más aventura, explora los manglares del este o relájate en las playas vírgenes de Camp Bay.

    A solo 40 minutos en lancha, los **Cayos Cochinos** son un santuario marino pristino gestionado por la [Fundación Cayos Cochinos](https://www.cayoscochinos.org/), que protege algunos de los arrecifes más intactos del Caribe. Los visitantes pueden hacer senderismo para avistar la boa rosada endémica en Cayo Mayor, hacer snorkel sobre arrecifes vírgenes y conocer la cultura garífuna auténtica en el pueblo pesquero de Chachahuate. La Fundación lleva programas activos de restauración de coral y conservación de tortugas marinas, convirtiéndolo en uno de los destinos ecoturísticos más valiosos de Honduras.
  tips:
    - "🏊 El mejor snorkel está en West Bay: puedes llegar al arrecife nadando desde la orilla."
    - "🐠 Usa protector solar 'reef-safe' (seguro para arrecifes) para proteger el coral."
    - "🛳️ Evita ir de compras cuando llegan los cruceros; los precios suelen subir."
    - "🦟 Usa repelente fuerte (tipo OFF! o Relec) frecuentemente; las pulgas de arena pican sin avisar."
    - "🛥️ Cayos Cochinos está a 40 min en lancha desde Roatán: excursión ideal a arrecifes vírgenes y boas rosadas."
    - "🐍 Haz una caminata guiada en Cayo Mayor para avistar la boa rosada endémica."
    - "🏘️ Visita el cayo Chachahuate para vivir la cultura garífuna auténtica en un área marina protegida."
