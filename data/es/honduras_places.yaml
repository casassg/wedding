- id: utila
  title: "Utila"
  description: "La más pequeña de las islas, con un ambiente relajado y bohemio. Ofrece buceo increíble en el [Arrecife Mesoamericano](https://es.wikipedia.org/wiki/Sistema_Arrecifal_Mesoamericano) y es uno de los mejores lugares del mundo para ver tiburones ballena (¡diciembre es temporada alta!). Es el único hogar de la iguana Swamper."
  icon: "fa-solid fa-fish"
  long_description: |
    Paraíso de mochileros y buceadores, Utila es conocida por tener cursos de certificación [PADI](https://www.padi.com/) muy económicos. Apenas hay autos; la gente se mueve en tuk-tuk, cuatrimoto o carritos de golf.

    Puntos destacados: [Airport Caves](https://www.google.com/maps/place/Airport+Caves/@16.1048,-86.9268,17z/) (cuevas y cañones submarinos increíbles accesibles desde la orilla, nivel intermedio); Neptune's en [Coral Beach Village](https://www.coralbeachutila.com/) (acceso en bote para playa y snorkel); [Water Caye](https://www.google.com/maps/place/Water+Cay/@16.1294,-86.8794,15z/) (cayo deshabitado de postal); [Pumpkin Hill](https://www.google.com/maps/place/Pumpkin+Hill/@16.1165,-86.9488,16z/) (caminata al punto más alto) y la [Utila Chocolate Company](https://www.instagram.com/utilachocolate/).
  tips:
    - "🦈 Diciembre es temporada alta de tiburones ballena, ¡ideal para verlos!"
    - "💰 Uno de los lugares más económicos del mundo para certificarse en buceo (PADI/SSI)."
    - "⛴️ Ferry desde Roatán (1h) o La Ceiba. Puedes reservar en [utilaferry.com](https://utilaferry.com/)."
    - "🤿 Airport Caves tiene snorkel espectacular desde la orilla (requiere saber nadar bien)."
    - "💵 Es preferible llevar efectivo (lempiras o dólares en buen estado)."
  links:
    - label: "Wikipedia"
      url: "https://en.wikipedia.org/wiki/Utila"
    - label: "Utila Guide"
      url: "https://www.utilaguide.com/"
      icon: "fa-solid fa-globe"
    - label: "Guía de Viaje"
      url: "https://madisonsfootsteps.com/trip-itinerary-utila-honduras/"
      icon: "fa-solid fa-book"

- id: ceiba
  title: "La Ceiba"
  description: "La 'Novia de Honduras' y puerta de entrada a las islas. Ubicada imponentemente a los pies del [Pico Bonito](https://es.wikipedia.org/wiki/Parque_nacional_Pico_Bonito) (2,435 m), ofrece rafting de clase mundial, cultura [garífuna](https://es.wikipedia.org/wiki/Gar%C3%ADfuna) y una animada vida nocturna."
  icon: "fa-solid fa-masks-theater"
  long_description: |
    Debe su nombre a una ceiba gigante que crecía cerca de los antiguos muelles. Hoy es el centro del ecoturismo en Honduras.

    Sus principales atracciones son el [Parque Nacional Pico Bonito](https://es.wikipedia.org/wiki/Parque_nacional_Pico_Bonito) (selva, cascadas y biodiversidad), el [Río Cangrejal](https://es.wikipedia.org/wiki/R%C3%ADo_Cangrejal) (rafting de nivel III-IV muy cerca de la ciudad) y el [Refugio de Vida Silvestre Cuero y Salado](https://es.wikipedia.org/wiki/Refugio_de_Vida_Silvestre_Cuero_y_Salado) (manglares y manatíes).

    El puerto de ferry conecta con Roatán y Utila dos veces al día. La Zona Viva y el Barrio La Isla ofrecen ambiente festivo y cultura local.
  tips:
    - "⛴️ Punto de partida hacia las Islas de la Bahía (ferries diarios)."
    - "🌊 Rafting de clase mundial (niveles III-IV) en el Río Cangrejal."
    - "🦭 En el Refugio Cuero y Salado puedes ver manatíes salvajes (tours en lancha)."
    - "🦋 El Museo de Mariposas e Insectos alberga más de 12,000 especímenes."
    - "🌿 Pico Bonito ofrece excelentes senderos y cascadas para los amantes de la naturaleza."
  links:
    - label: "Wikipedia"
      url: "https://es.wikipedia.org/wiki/La_Ceiba"

- id: yojoa
  title: "Lago de Yojoa"
  description: "El lago más grande de Honduras, rodeado de bosques nubosos y hogar de más de 400 especies de aves. Tours de chocolate artesanal, parques ecológicos y observación de aves, además de las Cuevas de Taulabé y las Cataratas de Pulhapanzak."
  icon: "fa-solid fa-dove"
  long_description: |
    A 80 km de San Pedro Sula, este impresionante lago ofrece múltiples actividades: tours de cacao y chocolate en [Yojoa Chocolate](https://yojoachocolate.com/) y [Luna del Puente](https://www.instagram.com/lunadelpuente/); el [Bioparque Paradise](https://www.hondurastips.hn/2013/07/29/bioparque-paradise-los-naranajos/) (senderos, cascadas y ruinas lencas); [PANACAM Lodge](https://www.panacamlodge.com/) en el [Parque Nacional Cerro Azul Meámbar](https://en.wikipedia.org/wiki/Cerro_Azul_Me%C3%A1mbar_National_Park) (naturaleza y vistas panorámicas); [D&D Brewery](https://ddbrewery.com/) (cervecería artesanal y observación de aves); senderos en el Parque Los Naranjos y restaurantes locales como Finca Las Glorias. También puedes visitar Los Domos de Agualpa y [Lagolandia](https://www.instagram.com/lagolandiahn/).

    La zona también ofrece dos paradas naturales espectaculares en la carretera principal: las **Cuevas de Taulabé**, que se extienden por kilómetros bajo tierra con estalactitas y estalagmitas espectaculares visibles desde pasarelas iluminadas, un escape perfecto del calor; y **Pulhapanzak**, una de las cascadas más bonitas de Centroamérica, con 43 metros de agua cayendo en una piscina natural rodeada de bosque tropical, donde puedes hacer rappel detrás de la cascada, nadar en las piscinas naturales y ver guacamayas en los senderos.
  tips:
    - "🍺 Visita D&D Brewery, la primera cervecería artesanal de Honduras."
    - "🍫 Haz un tour de chocolate para ver el proceso desde el cacao hasta la barra."
    - "🐟 Prueba la tilapia frita 'estilo Lago de Yojoa' en los restaurantes de la carretera."
    - "🐦 Paraíso para observadores de aves (+400 especies); ¡trae binoculares!"
    - "🌡️ Ambas son perfectas para escapar del calor: las cuevas se mantienen frescas, Pulhapanzak tiene su poza con brisa."
    - "🧗 En Pulhapanzak puedes hacer rappel detrás de la cascada de 43 m (guiado, costo extra)."
    - "👟 Lleva calzado cómodo para ambas; las cuevas tienen pasarelas, la catarata tiene senderos."
    - "📍 Ambas están en la carretera principal: Taulabé ~1h de Copán, Pulhapanzak ~1.5h."
    - "🦜 Pulhapanzak es un buen lugar para ver guacamayas."
