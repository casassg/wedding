- id: tegucigalpa
  title: "Tegucigalpa"
  description: "La capital de Honduras en un valle montañoso a 1.000 m de altitud, con arquitectura colonial, mercados animados y bosques nubosos cercanos. A las afueras: pueblos coloniales de montaña, un mirador estilo Cristo Redentor y buena comida."
  icon: "fa-solid fa-city"
  long_description: |
    Fundada en 1578 en las laderas del cerro El Picacho, Tegucigalpa es la capital política de Honduras y una ciudad de contrastes. El centro histórico alberga la [Catedral de San Miguel](https://en.wikipedia.org/wiki/Cathedral_of_Saint_Michael_the_Archangel,_Tegucigalpa) (siglo XVIII), la Galería Nacional de Arte en el antiguo Paraninfo y el animado Mercado San Isidro. La [Basílica de Suyapa](https://es.wikipedia.org/wiki/Bas%C3%ADlica_de_Nuestra_Se%C3%B1ora_de_Suyapa), dedicada a la pequeña imagen patrona de Honduras, recibe peregrinos todo el año, especialmente el 3 de febrero.

    Tres pueblecitos comparten la misma carretera a solo 30 minutos de la ciudad. **[Valle de Ángeles](https://en.wikipedia.org/wiki/Valle_de_%C3%81ngeles)** es un pueblo colonial de montaña precioso, famoso por sus artesanías, calles empedradas y mercados de fin de semana. **San Juancito** es un antiguo pueblo minero, y **Santa Lucía** ofrece las mejores vistas del valle.

    Más cerca de la ciudad, el **Cristo del Picacho** es la versión más pequeña del Cristo Redentor de Río: una estatua en la cima con vistas panorámicas, restaurantes y sitios de vino, a unos 15 minutos del centro. A unos 40 minutos, **Finca La Catadora** es un peculiar viñedo de moras con buena comida y vistas. Para los amantes del aire libre, el **[Parque Nacional La Tigra](https://en.wikipedia.org/wiki/La_Tigra_National_Park)** es un bosque nuboso con excelentes senderos, una de las áreas protegidas más antiguas del país.

    De vuelta en la ciudad, **9 Patrias** ofrece un menú degustación de 7 platos nacido de un programa universitario de gastronomía: ingredientes locales inspirados en tribus antiguas de Honduras, como pescado cocinado con cacao, con cada plato explicado, una experiencia estilo Michelin a un nivel más accesible. Para la historia, no te pierdas el [Museo para la Identidad Nacional](https://share.google/adcS2XJ4qalKy4lGi).
  tips:
    - "🌿 El Parque Nacional La Tigra está a solo 30 minutos del centro."
    - "☕ Cafeterías recomendadas en la ciudad: Nativo, Cafetano, Plácido, La Montaña, Varietal, TGP, Crepería, Aroma."
    - "☕ En los pueblos: Varietal en Valle de Ángeles; La Casa del Té y Tres Puntos en Santa Lucía."
    - "🌲 Los pueblos de montaña son más frescos que la ciudad; lleva una chaqueta ligera."
  links:
