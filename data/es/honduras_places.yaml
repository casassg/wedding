- id: puerto_cortes
  title: "Puerto Cortés y Omoa"
  description: "La principal ciudad portuaria caribeña de Honduras, con un hermoso centro histórico, y el cercano pueblo playero de Omoa con su impresionante fortaleza del siglo XVIII y mariscos increíbles, a solo 20-40 minutos del aeropuerto."
  icon: "fa-solid fa-anchor"
  long_description: |
    Puerto Cortés es el principal puerto caribeño de Honduras, con una historia profunda. Fundado en el siglo XVI, fue uno de los puertos coloniales más importantes de España, exportando plata, añil y otros bienes a Europa. Hoy, el [centro histórico](https://www.youtube.com/watch?v=QBRrNOe4tVY) conserva casas de madera coloniales de colores y un malecón animado.

    A solo 20 minutos al sur está **Omoa**, un pueblo playero relajado donde la atracción principal es la [Fortaleza de San Fernando de Omoa](https://es.wikipedia.org/wiki/Fortaleza_de_San_Fernando_de_Omoa), una imponente fortaleza colonial española del siglo XVIII construida para proteger la costa de los piratas, que ahora alberga un pequeño museo. Las playas de Omoa tienen aguas tranquilas perfectas para nadar, y las *comidas típicas* (pescado frito, camarones, pan de coco) son de las mejores de Honduras.

    [Villas Amelia](https://www.instagram.com/villas.amelia/) es de un amigo nuestro, perfecto para alojarse o visitarla.
  tips:
    - "🏰 No te pierdas la Fortaleza de San Fernando en Omoa, uno de los sitios coloniales más importantes de Honduras."
    - "🐟 Prueba el pescado frito y los camarones en la playa de Omoa, de los mejores mariscos del país."
    - "🏘️ Explora el centro histórico de Puerto Cortés con sus casas de madera coloniales de colores."
    - "📍 Puerto Cortés está a 20 min del aeropuerto SAP; Omoa a 40 min, parada perfecta de camino a Copán."
    - "🚢 Observa los barcos de carga desde el malecón de Puerto Cortés, uno de los puertos más activos de Centroamérica."
