- id: tela
  title: "Tela"
  description: "Ciudad costera caribeña con grandes atractivos: el [Parque Nacional Punta Sal](https://es.wikipedia.org/wiki/Parque_nacional_Jeannette_Kawas), el [Jardín Botánico Lancetilla](https://es.wikipedia.org/wiki/Jard%C3%ADn_Bot%C3%A1nico_Lancetilla) (el más grande de Latinoamérica) y hermosas playas."
  icon: "fa-solid fa-umbrella-beach"
  long_description: |
    Tela combina playas caribeñas con naturaleza. Punta Sal ([Parque Nacional Jeannette Kawas](https://en.wikipedia.org/wiki/Jeannette_Kawas_National_Park)) ofrece playas vírgenes y selva. [Playa Miami](https://www.google.com/maps/place/Playa+Miami/@15.7694,-87.4427,16z/) es ideal para familias por sus aguas tranquilas.

    El [Jardín Botánico Lancetilla](https://en.wikipedia.org/wiki/Lancetilla_Botanical_Garden) (fundado en 1926) alberga más de 1,500 especies de plantas. [Indura Resort](https://www.induraresort.com/) ofrece golf y lujo, mientras que [La Ensenada](https://www.google.com/maps/place/La+Ensenada+Beach+Resort/@15.7903,-87.4825,15z/) y el [Hotel Telamar](https://www.google.com/maps/place/Villas+Telamar/@15.7756,-87.4593,16z/) son opciones clásicas frente al mar.
  tips:
    - "🏖️ Reserva un tour en lancha a Punta Sal para ver playas vírgenes y fauna."
    - "🌿 Visita el Jardín Botánico Lancetilla, un tesoro natural a solo 5 min."
    - "🥥 Prueba el pan de coco y el agua de coco fresca en la playa."
