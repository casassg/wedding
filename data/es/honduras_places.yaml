- id: san_pedro
  title: "San Pedro Sula"
  description: "La capital industrial de Honduras. Desde aquí puedes explorar el Parque Nacional El Cusuco, los senderos de Angeli Gardens, el mercado artesanal Guamilito o los campos de hortensias de El Merendón."
  icon: "fa-solid fa-city"
  long_description: |
    La segunda ciudad más grande del país ofrece excelentes excursiones a menos de 100 km. El [Parque Nacional El Cusuco](https://en.wikipedia.org/wiki/Cusuco_National_Park) es una reserva de bosque nuboso con gran biodiversidad.

    [Angeli Gardens](https://www.instagram.com/angeligardens/) ofrece senderos y canopy. El [Mercado Guamilito](https://www.google.com/maps/place/Guamilito+Market/@15.5026,-88.0284,17z/) es ideal para comprar artesanías y flores. El Merendón cuenta con el famoso rótulo de Coca Cola y vistas panorámicas. Si llegas tarde o tienes un vuelo temprano a la mañana siguiente, el Intercity y el Diana Princess son buenas opciones para una noche cerca del aeropuerto.
  tips:
    - "🌺 Sube a El Merendón para ver la ciudad y comprar flores."
    - "🛍️ Visita el Mercado Guamilito para artesanías y comida típica."
    - "🌿 Explora el bosque nuboso del Parque Nacional El Cusuco."
    - "☕ Cafeterías recomendadas en San Pedro Sula: Welchez, Backup, Mezcal, TGP, Cafeteo. En Peña Blanca: Dorao."
