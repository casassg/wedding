- question: "❤️ ¿Por qué Copán?"
  answer: "Copán fue uno de los primeros lugares que visitamos juntos como pareja, cuando Gerard vino a Honduras por primera vez. Los dos nos enamoramos de este lugar y significa muchísimo para nosotros. Además, es un pueblo precioso con un montón de [actividades y lugares para visitar](/es/traveling/)."

- question: "✈️ ¿Cómo llego a Copán?"
  answer: "Vuela a San Pedro Sula (SAP): es el aeropuerto internacional más cercano a Copán. Consulta nuestra [página de viajes](/es/traveling/) para ver las opciones de vuelo desde Europa y EE.UU./Canadá. Para llegar del aeropuerto a San Pedro Sula, muchos hoteles de San Pedro Sula incluyen transporte desde el aeropuerto; contacta a tu hotel al reservar para asegurarte. Si no, puedes usar los taxis oficiales del aeropuerto o Uber. Si usas Uber, verifica el conductor y la matrícula antes de subir. Evita taxis desconocidos en la calle. Una vez en San Pedro Sula, mira la siguiente pregunta para saber cómo llegar a Copán."

- question: "🚌 ¿Cómo llego de San Pedro Sula a Copán?"
  answer: "¡Ofrecemos un shuttle para los invitados que viajen desde el extranjero, y recomendamos tomarlo! Te recoge en San Pedro Sula o en el aeropuerto SAP el jueves y el viernes antes de la boda, y te lleva de vuelta a San Pedro Sula o al aeropuerto el domingo por la mañana o por la tarde. Si ninguna de estas opciones te funciona, te recomendamos reservar un traslado privado con nuestro proveedor local de confianza, [Chelsy Tours](/es/traveling/#transport-provider), que también puede recogerte en el aeropuerto. Si te quedas una noche en San Pedro Sula, tu hotel también puede ofrecer recogida y/o dejada en el aeropuerto SAP. No recomendamos conducir ni alquilar un auto, pero si alquilas uno, es mejor no viajar de San Pedro Sula a Copán después de las 3 de la tarde: hay mucho tráfico saliendo de la ciudad hasta las 8 de la noche, y conducir de noche puede ser complicado por los animales en la carretera."

- question: "🗺️ ¿Dónde puedo viajar en Honduras? ¿Alguien me puede ayudar a planificar?"
  answer: "¡Sí! Nuestra agente de viajes de confianza, Maureen Alfaro de D'Mundo Travel, puede ayudarte a reservar paquetes vacacionales por Honduras y hoteles en Copán. ¡Menciona el código **Casas Paz** para obtener 5% de descuento! [Contáctala aquí](/es/traveling/#travel-agent)."

- question: "🌤️ ¿Qué tiempo hará?"
  answer: "¡Esperamos un clima primaveral precioso! Días agradables (~25°C) y noches frescas (~16°C). Al ser el inicio de la temporada seca, es poco probable que llueva. Recomendamos traer una chaqueta ligera o suéter para las noches."

- question: "👗 ¿Cuál es el código de vestimenta?"
  answer: "**Formal.** Queremos que todos se vean guapos y elegantes para celebrar con nosotros. ¡Vengan listos para bailar y disfrutar! Hombres: Traje de color oscuro con camisa, corbata o corbatín opcional y zapatos elegantes. Mujeres: Vestido largo, vestido de cóctel elegante o traje sastre."

- question: "💄 ¿Dónde puedo hacerme el pelo y maquillaje en Copán para la boda?"
  answer: "**Maybely Aguirre Studio** nos fue recomendado por alguien que vive en Copán para maquillaje y peinado. Puedes contactar a Maybely a través de su [Instagram](https://www.instagram.com/maybelyaguirrestudio) para reservar una cita."

- question: "🌍 ¿Qué pasa si no puedo ir a Honduras?"
  answer: "No se preocupen, ¡sabemos que es un viaje largo! Por eso, en primavera de 2027 organizaremos una celebración informal en Cataluña. Sin ceremonia, solo celebración y amigos. ¡Pronto daremos más detalles!"

- question: "🍹 ¿Habrá algo el viernes?"
  answer: "👀 Probablemente iremos a tomar algo la noche anterior en algún bar de Copán Ruinas, ideal para quienes ya hayan llegado. ¡Les avisaremos con los detalles!"

- question: "🛡️ ¿Es seguro viajar a Honduras?"
  answer: "Aunque Honduras tiene una reputación complicada, **Copán Ruinas se considera uno de los destinos más seguros y tranquilos** del país. Recomendamos leer nuestra [guía de viaje](/es/traveling/) para más información. Como en cualquier lugar turístico, recomendamos sentido común y no llevar joyas muy llamativas."

- question: "🦟?"
  answer: "Los mosquitos son habituales en las zonas tropicales como Honduras, menos en diciembre pero siempre hay. Recomendamos traer **repelente de insectos** para evitar picaduras (el dengue está presente en el país). Lee nuestra [guía de viaje](/es/traveling/) para más información."

- question: "🎁 ¿Regalos?"
  answer: "¡Estamos muy felices de que nos acompañen! En serio, ¡solo vengan! ❤️ Pero si _realmente_ quieren regalarnos algo, pueden ayudarnos a que nuestro viaje de novios sea inolvidable **[aquí 😊](https://donate.stripe.com/eVq5kCgIz9qdfLycrd0Ny00?locale=es-419)**. _¿A la antigua?_ También aceptaremos sobres con gusto en la boda 💌."

- question: "🏨 ¿Hay hoteles recomendados?"
  answer: "¡Sí! Mira la [sección Dónde alojarse](/es/traveling/#where-to-stay) para ver las opciones disponibles, tarifas y cómo reservar."
