name: Deploy Review App

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_ORG_SECRET }}
  FLY_REGION: iad
  FLY_ORG: personal

jobs:
  review_app:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      name: ${{ steps.deploy.outputs.name }}
    concurrency:
      group: pr-${{ github.event.number }}
    environment:
      name: review
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Get code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init Hermit
        uses: cashapp/activate-hermit@v1

      - name: Build Hugo frontend
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Tegucigalpa
        run: hugo --gc --minify --baseURL "/"

      - name: Deploy or destroy PR app on Fly.io
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.number }}
          EVENT_ACTION: ${{ github.event.action }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: |
          set -e
          repo_name="${GITHUB_REPOSITORY##*/}"
          app="pr-${PR_NUMBER}-${GITHUB_REPOSITORY_OWNER}-${repo_name}"
          app="${app//_/-}"
          app=$(echo "$app" | tr '[:upper:]' '[:lower:]')
          config="fly.review.toml"

          echo "App: $app"

          if [ "$EVENT_ACTION" = "closed" ]; then
            flyctl apps destroy "$app" -y || true
            echo "name=$app" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Create app if it doesn't exist
          if ! flyctl status --app "$app" 2>/dev/null; then
            cp "$config" "$config.bak"
            flyctl launch --no-deploy --copy-config --name "$app" \
              --region "$FLY_REGION" --org "$FLY_ORG"
            cp "$config.bak" "$config"
          fi

          # Set secrets via stdin (avoids leaking via argv)
          printf 'GOOGLE_SHEET_ID=%s\nGOOGLE_SHEETS_CREDENTIALS=%s\n' \
            "$GOOGLE_SHEET_ID" "$(printf '%s' "$GOOGLE_SHEETS_CREDENTIALS" | tr -d '\n')" \
            | flyctl secrets import --app "$app"

          # Deploy with retry (transient "concurrent update" races on Fly)
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt..."
            if flyctl deploy --config "$config" --app "$app" \
              --regions "$FLY_REGION" --strategy immediate --ha=false \
              --vm-cpu-kind shared --vm-cpus 1 --vm-memory 256; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Deploy failed after 3 attempts"
              exit 1
            fi
            echo "Retrying in 15s..."
            sleep 15
          done

          # Extract hostname for PR environment URL
          hostname=$(flyctl status --app "$app" --json | jq -r .Hostname)
          echo "url=https://$hostname" >> "$GITHUB_OUTPUT"
          echo "name=$app" >> "$GITHUB_OUTPUT"

      - name: Clean up GitHub environment
        uses: strumwolf/delete-deployment-environment@v2
        if: ${{ github.event.action == 'closed' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: pr-${{ github.event.number }}