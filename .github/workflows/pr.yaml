name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

jobs:
  checks:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Init Hermit
        uses: cashapp/activate-hermit@v1

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Test Go backend
        run: ./bin/go -C backend test ./...

      - name: Check frontend
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Tegucigalpa
        run: |
          ./bin/hugo --gc --minify --baseURL "/"
          ./bin/node --check assets/js/main.js
          ./bin/uv run scripts/check-i18n.py

  review_app:
    needs: checks
    if: ${{ always() && (github.event.action == 'closed' || needs.checks.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_ORG_SECRET }}
      FLY_REGION: iad
      FLY_ORG: personal
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      name: ${{ steps.deploy.outputs.name }}
    concurrency:
      group: pr-${{ github.event.number }}
    environment:
      name: review
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Get code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init Hermit
        uses: cashapp/activate-hermit@v1

      - name: Build review frontend
        if: github.event.action != 'closed'
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Tegucigalpa
        run: ./bin/hugo --gc --minify --baseURL "/"

      - name: Create Fly app
        id: deploy
        if: github.event.action != 'closed'
        env:
          APP_NAME: pr-${{ github.event.number }}-casassg-wedding
        run: |
          if ! flyctl status --app "$APP_NAME" >/dev/null 2>&1; then
            flyctl apps create "$APP_NAME" --org "$FLY_ORG"
          fi
          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "url=https://$APP_NAME.fly.dev" >> "$GITHUB_OUTPUT"

      - name: Set Fly secrets
        if: github.event.action != 'closed'
        env:
          APP_NAME: pr-${{ github.event.number }}-casassg-wedding
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: |
          printf 'GOOGLE_SHEET_ID=%s\nGOOGLE_SHEETS_CREDENTIALS=%s\n' \
            "$GOOGLE_SHEET_ID" "$(printf '%s' "$GOOGLE_SHEETS_CREDENTIALS" | tr -d '\n')" \
            | flyctl secrets import --app "$APP_NAME" --stage

      - name: Deploy review app
        if: github.event.action != 'closed'
        env:
          APP_NAME: pr-${{ github.event.number }}-casassg-wedding
        run: flyctl deploy --app "$APP_NAME" --config fly.review.toml --ha=false

      - name: Destroy review app
        if: github.event.action == 'closed'
        env:
          APP_NAME: pr-${{ github.event.number }}-casassg-wedding
        run: flyctl apps destroy "$APP_NAME" --yes || true

      - name: Clean up GitHub environment
        if: github.event.action == 'closed'
        uses: strumwolf/delete-deployment-environment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: pr-${{ github.event.number }}
