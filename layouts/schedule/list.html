{{ define "main" }}
<!-- Hero Section -->
<section class="pt-28 pb-12 md:pt-36 md:pb-16 px-6 bg-lavender section-colored">
    <div class="max-w-3xl mx-auto text-center">
        <a href="{{ .Site.Home.RelPermalink }}" class="inline-flex items-center text-xs font-bold uppercase tracking-widest text-white/80 hover:text-white transition mb-6 font-sans">
            <i class="fa-solid fa-arrow-left mr-2"></i>
            {{ i18n "schedule_back_home" }}
        </a>
        <h1 class="font-hand text-5xl md:text-7xl text-white mb-3">{{ i18n "schedule_title" }}</h1>
        <p class="text-base md:text-lg text-white/85 font-sans max-w-xl mx-auto leading-relaxed">{{ i18n "schedule_subtitle" }}</p>
    </div>
</section>

<!-- Schedule Section -->
<section class="py-12 md:py-20 px-6 bg-cream" x-data="scheduleComponent('{{ .Site.Language.Lang }}')" data-ends-prefix="{{ i18n "schedule_ends_prefix" }}" data-ended-prefix="{{ i18n "schedule_ended_prefix" }}">
    <div class="max-w-2xl mx-auto">
        <!-- Loading -->
        <div x-show="loading">
            <span class="sr-only">{{ i18n "schedule_loading" }}</span>
            <div class="schedule-skeleton" aria-hidden="true">
                <div class="h-8 w-56 bg-gray-200/80 rounded mb-4"></div>
                <div class="divide-y divide-gray-200/80">
                    {{- range seq 3 }}
                    <div class="py-5 md:py-6">
                        <div class="flex items-baseline justify-between gap-4 mb-2">
                            <div class="h-6 w-1/2 bg-gray-200/80 rounded"></div>
                            <div class="h-4 w-24 bg-gray-200/70 rounded"></div>
                        </div>
                        <div class="h-4 w-2/3 bg-gray-200/60 rounded"></div>
                    </div>
                    {{- end }}
                </div>
            </div>
        </div>

        <!-- Error -->
        <div x-show="error && !loading" x-cloak class="py-16 text-center">
            <p class="text-gray-600 font-sans mb-4">{{ i18n "schedule_error" }}</p>
            <button type="button" @click="loading = true; error = null; fetchSchedule()" class="text-sm font-semibold text-lavender hover:text-lavender/75 underline underline-offset-4 transition font-sans">
                {{ i18n "schedule_retry" }}
            </button>
        </div>

        <!-- Empty -->
        <div x-show="!loading && !error && visibleEvents.length === 0" x-cloak class="py-16 text-center">
            <img src="{{ "images/flowers/wildflower.svg" | relURL }}" alt="" class="w-7 h-7 mx-auto mb-4 opacity-60">
            <p class="text-gray-600 font-sans">{{ i18n "schedule_empty" }}</p>
        </div>

        <!-- Timeline -->
        <div x-show="!loading && !error && visibleEvents.length > 0" x-cloak>
            <button type="button"
                    x-show="hiddenPastCount > 0"
                    @click="showEarlier = !showEarlier"
                    class="mb-8 inline-flex items-center gap-2 text-xs font-semibold text-gray-500 hover:text-lavender transition font-sans border border-gray-200 hover:border-lavender/40 bg-white/70 rounded-full px-4 py-2">
                <i class="fa-solid text-[10px]" :class="showEarlier ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                <span x-show="!showEarlier">{{ i18n "schedule_show_earlier" }} (<span x-text="hiddenPastCount"></span>)</span>
                <span x-show="showEarlier">{{ i18n "schedule_hide_earlier" }}</span>
            </button>

            <template x-for="(dayEvents, date) in groupedEvents" :key="date">
                <div class="mb-12 md:mb-16 last:mb-0">
                    <div class="sticky top-[72px] z-10 bg-cream/95 backdrop-blur-sm py-3 border-b border-lavender/25">
                        <h2 class="font-hand text-3xl md:text-4xl text-gray-800" x-text="formatDateHeader(date)"></h2>
                    </div>
                    <div class="schedule-list">
                        <template x-for="(event, index) in dayEvents" :key="(event.start_time || '') + '-' + index">
                            <article class="transition-colors" :class="event.isCurrent ? 'py-5 md:py-6 schedule-row-current -mx-3 px-3 sm:-mx-4 sm:px-4 my-1 rounded-2xl' : (event.isPast ? 'py-3.5 md:py-4' : 'py-5 md:py-6')">
                                <div class="flex items-baseline justify-between gap-3">
                                    <h3 class="font-hand text-3xl leading-tight min-w-0" :class="event.isPast ? 'text-gray-400' : 'text-gray-800'" x-text="event.localizedName"></h3>
                                    <span class="inline-flex items-center gap-1.5 shrink-0 font-sans text-xs sm:text-sm tabular-nums whitespace-nowrap"
                                          :title="event.relativeTime ? event.timeDisplay : ''"
                                          :class="event.isCurrent ? 'font-semibold text-lavender' : (event.isPast ? 'font-medium text-gray-400' : 'font-medium text-gray-500')">
                                        <span x-show="event.isCurrent" class="schedule-live-dot w-2 h-2 rounded-full bg-lavender"></span>
                                        <span x-show="event.isCurrent" class="sr-only">{{ i18n "schedule_now" }}: </span>
                                        <i x-show="event.isPast" class="fa-solid fa-check text-[10px]"></i>
                                        <span x-show="event.isPast" class="sr-only">{{ i18n "schedule_completed" }}: </span>
                                        <span x-text="event.displayTime"></span>
                                    </span>
                                </div>
                                <a x-show="event.location && !event.isPast"
                                   :href="'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(event.location + ', Ruinas Copan, Honduras')"
                                   target="_blank" rel="noopener noreferrer"
                                   class="group inline-flex items-baseline gap-1.5 mt-1.5 text-sm font-sans text-gray-500 hover:text-rose transition">
                                    <i class="fa-solid fa-location-dot text-xs shrink-0 text-rose/75"></i>
                                    <span class="underline decoration-gray-300 underline-offset-4 group-hover:decoration-current transition" x-text="event.location"></span>
                                </a>
                                <p x-show="event.localizedDescription && !event.isPast" class="mt-2 text-sm leading-relaxed font-sans text-gray-600" x-text="event.localizedDescription"></p>
                            </article>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>
</section>

<!-- Floral finish -->
<section class="pt-4 pb-16 px-6 bg-cream">
    <div class="max-w-2xl mx-auto text-center">
        <div class="flex items-center justify-center gap-4 mb-8">
            <span class="h-px w-12 bg-lavender/30"></span>
            <img src="{{ "images/flowers/wildflower.svg" | relURL }}" alt="" class="flower-divider">
            <span class="h-px w-12 bg-lavender/30"></span>
        </div>
        <a href="{{ .Site.Home.RelPermalink }}" class="text-xs font-bold uppercase tracking-widest text-gray-500 hover:text-rose transition font-sans">
            {{ i18n "schedule_back_home" }}
        </a>
    </div>
</section>
{{ end }}
